<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#236B76" />
<title>SS Logistics</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    /* SS Logistics brand: mint, aqua and deep teal from the logo */
    --ink:#123A40; --deep:#236B76; --moss:#2F7D87; --lime:#3BB3C8; --mint:#B6DDC8; --aqua:#3BB3C8;
    --sand:#E7F4F2; --paper:#F3F9F8; --line:#D6E8E6; --slate:#5F7E82;
    --alert:#C0473B; --amber:#C98A2E; --ok:#1F8A6A; --r:14px; --tap:48px;
    --grad:linear-gradient(135deg,#2F7D87 0%,#3BB3C8 100%);
    --shadow:0 1px 2px rgba(18,58,64,.06),0 4px 16px rgba(18,58,64,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4}
  .topbar{position:sticky;top:0;z-index:20;background:var(--deep);color:var(--sand);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.16em;font-size:14px;text-transform:uppercase;white-space:nowrap}
  .brand b{color:var(--lime)}
  .topbar select{width:auto;height:36px;font-size:14px;background:#fff;min-width:180px;max-width:100%}
  .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right;line-height:1.2}
  .who a{color:var(--lime);cursor:pointer}
  .tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:56px;z-index:15}
  .tabs button{width:auto;height:44px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;font-size:14px;font-weight:700;color:var(--slate);padding:0 12px;white-space:nowrap}
  .tabs button.on{color:var(--deep);border-bottom-color:var(--lime)}
  .tabs .sep{width:1px;background:var(--line);margin:10px 6px}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
  h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:4px 0 12px;font-weight:800}
  h2{font-size:15px;margin:0 0 10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin:0 0 5px;font-weight:700}
  input,select,textarea{width:100%;height:var(--tap);font-size:15px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit}
  textarea{height:auto;min-height:120px;padding:10px 12px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss);background:#fff}
  input[type=checkbox]{width:20px;height:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .field{margin-bottom:12px}
  button{height:var(--tap);border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;padding:0 16px;font-family:inherit}
  .primary{background:var(--deep);color:#fff} .primary:disabled{background:#A9B4AE}
  .lime{background:var(--lime);color:var(--ink)}
  .ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line)}
  .danger{background:var(--alert);color:#fff}
  .sm{height:34px;font-size:13px;padding:0 10px;border-radius:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row>*{flex:0 0 auto}
  .grow{flex:1 1 auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);border-bottom:2px solid var(--line);padding:8px 6px;white-space:nowrap}
  td{border-bottom:1px solid #eee7d8;padding:8px 6px;vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .tbl{overflow-x:auto}
  .chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sand);color:var(--ink);white-space:nowrap}
  .chip.ok{background:#DCEFD9;color:var(--ok)} .chip.warn{background:#F6E6CC;color:#8a5a14} .chip.bad{background:#F4D7D3;color:var(--alert)} .chip.info{background:#DDE9F3;color:#20507a}
  .plate{font-family:Consolas,monospace;font-weight:800;white-space:nowrap;display:inline-block;background:var(--lime);color:var(--ink);padding:3px 8px;border-radius:6px;letter-spacing:.04em}
  .muted{color:var(--slate);font-size:13px}
  .issues{background:#FBEDEA;border:1px solid #EFC2BB;color:var(--alert);border-radius:10px;padding:10px 14px;margin:10px 0}
  .okbox{background:#E8F4E4;border:1px solid #C3DFBA;color:var(--ok);border-radius:10px;padding:10px 14px;margin:10px 0}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
  .toast{z-index:200!important;position:fixed;left:16px;right:16px;bottom:20px;max-width:560px;margin:0 auto;z-index:60;padding:12px 16px;border-radius:12px;color:#fff;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateY(160%);transition:transform .3s}
  .toast{visibility:hidden} .toast.show{transform:translateY(0);visibility:visible} .toast.ok{background:var(--ok)} .toast.err{background:var(--alert)} .toast.warn{background:var(--amber)}
  .modal{position:fixed;inset:0;background:rgba(11,31,23,.5);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
  .modal .box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:18px}
  .hide{display:none!important}
  .center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;margin:0 auto}
  .logo{font-weight:800;letter-spacing:.2em;font-size:26px;text-transform:uppercase;text-align:center;margin-bottom:6px}
  .logo b{color:var(--moss)}
  .tag{text-align:center;color:var(--slate);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:30px}
  .empty{text-align:center;color:var(--slate);padding:22px 10px;font-size:14px}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:s .7s linear infinite;vertical-align:-4px}
  @keyframes s{to{transform:rotate(360deg)}}
  pre.msg{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;max-height:260px;overflow:auto}
  /* ===== home: one block per module ===== */
  body.home .side, body.home .menuBtn, body.home #locSel{display:none!important}
  .home-wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
  .home-hello{font-size:22px;font-weight:800;margin:0 0 4px}
  .mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:22px}
  .mod{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;height:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer;color:var(--ink);font-family:inherit;transition:transform .12s, box-shadow .12s, border-color .12s}
  .mod:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(11,61,46,.12);border-color:var(--moss)}
  .mod .ic{width:48px;height:48px;border-radius:12px;background:#EEF5E6;color:var(--deep);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .mod .nm{font-size:18px;font-weight:800;margin-bottom:6px}
  .mod .ds{font-size:13.5px;color:var(--slate);font-weight:500;line-height:1.45}
  .side .back{color:var(--moss);font-weight:800}
  @media (min-width:1024px){ .homeLinks{display:none} }
  @media (max-width:640px){ .mods{grid-template-columns:1fr 1fr;gap:12px} .mod{padding:16px 14px} .mod .nm{font-size:16px} .mod .ds{display:none} .home-wrap{padding:18px 14px 60px} }
  /* ===== responsive shell: sidebar on desktop, drawer on tablet & phone ===== */
  input,select,textarea{font-size:16px}
  .topbar{position:sticky;top:0;z-index:30;flex-wrap:nowrap;min-height:56px}
  .menuBtn{display:none;background:none;color:var(--sand);font-size:24px;height:44px;width:44px;padding:0;flex:0 0 auto}
  .shell{display:flex;align-items:flex-start}
  .side{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);padding:8px 0 24px}
  .sideHead{display:none}
  .side .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:800;padding:14px 18px 6px}
  .side button{display:block;width:100%;text-align:left;height:42px;background:none;border:0;border-left:4px solid transparent;border-radius:0;font-size:14.5px;font-weight:700;color:var(--ink);padding:0 14px}
  .side button:hover{background:var(--paper)}
  .side button.on{border-left-color:var(--lime);background:#EEF5E6;color:var(--deep)}
  .scrim{display:none}
  .wrap{flex:1 1 auto;min-width:0;max-width:1180px}
  .modal .box{max-height:calc(100vh - 60px);overflow:auto}
  @media (max-width:1023px){
    .menuBtn{display:block}
    .side{position:fixed;top:0;left:0;bottom:0;height:100vh;z-index:50;width:280px;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
    body.nav-open .side{transform:none}
    body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(11,31,23,.45);z-index:45}
    .sideHead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--deep);color:var(--sand);font-size:13px}
    .sideHead a{color:var(--lime);cursor:pointer}
    .who{display:none}
    .topbar select{flex:1 1 auto;min-width:0}
  }
  @media (max-width:640px){
    .brand{display:none}
    .wrap{padding:12px 12px 80px}
    .grid{grid-template-columns:1fr}
    .kpi{grid-template-columns:1fr 1fr}
    .kpi b{font-size:18px}
    .card{padding:12px}
    .row>button,.row>a{flex:1 1 auto}
    .modal{padding:0}
    .modal .box{max-width:none;min-height:100vh;border-radius:0;max-height:none}
    /* tables become cards: one row = one card, each cell labelled */
    .tbl table,.tbl thead,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
    .tbl thead{display:none}
    .tbl tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
    .tbl td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
    .tbl td::before{content:attr(data-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);font-weight:700;text-align:left;flex:0 0 auto;padding-top:2px}
    .tbl td[data-label=""]::before{display:none}
    .tbl td[data-label=""]{justify-content:flex-end;flex-wrap:wrap}
    .tbl td input,.tbl td select{max-width:60%}
  }
  @media (min-width:641px) and (max-width:1023px){ .wrap{padding:14px 18px 80px} }
  /* ===== SS Logistics theme ===== */
  body{background:var(--paper);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  .topbar{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 6px 20px rgba(18,58,64,.05)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);letter-spacing:0;text-transform:none;font-size:16px;font-weight:800}
  .brand img{width:34px;height:34px;object-fit:contain}
  .brand .bname{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  #modName{color:var(--slate);font-weight:600}
  #modName:not(:empty)::before{content:"·";margin:0 6px 0 2px;color:var(--line)}
  .menuBtn{color:var(--deep)}
  .topbar select{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600;border-radius:10px}
  .who{color:var(--slate);opacity:1}
  .who a,.who #uRole{color:var(--deep)!important;font-weight:600}
  .side{background:#fff;border-right:1px solid var(--line)}
  .side button{color:var(--ink);font-weight:600;border-radius:0 10px 10px 0;margin-right:10px;width:calc(100% - 10px);transition:background .15s,color .15s}
  .side button:hover{background:var(--sand)}
  .side button.on{border-left-color:var(--aqua);background:linear-gradient(90deg,#DDF1F3,#EEF8F6);color:var(--deep);font-weight:800}
  .side .grp{color:var(--moss)}
  .sideHead{background:var(--grad)!important;color:#fff!important}
  .sideHead a{color:#fff!important;text-decoration:underline}
  h1{color:var(--moss);letter-spacing:.1em}
  .card{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
  input,select,textarea{background:#fff;border-color:var(--line);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 4px rgba(59,179,200,.15)}
  input:disabled{background:var(--paper);color:var(--slate)}
  button{transition:transform .08s,box-shadow .15s,filter .15s}
  button:active{transform:scale(.98)}
  .primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(47,125,135,.25)}
  .primary:hover{filter:brightness(1.05);box-shadow:0 6px 18px rgba(47,125,135,.32)}
  .primary:disabled{background:#B7CDCF;box-shadow:none}
  .lime{background:var(--mint);color:var(--ink)}
  .lime:hover{filter:brightness(.97)}
  .ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line)}
  .ghost:hover{border-color:var(--aqua);background:#F7FCFC}
  .plate{background:#FFF6D6;color:#3A2E00;border:1.5px solid #E5CF7A}
  th{color:var(--moss);border-bottom-color:var(--line)}
  td{border-bottom-color:#E9F2F1}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#F6FBFB}
  .chip{background:var(--sand);color:var(--deep)}
  .chip.ok{background:#DDF3EA;color:var(--ok)} .chip.info{background:#DDF1F5;color:#1D6C7D}
  .kpi div{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;background:#fff}
  .kpi span{color:var(--moss)}
  .okbox{background:#E6F5EF;border-color:#BFE3D2;color:var(--ok)}
  .toast.ok{background:var(--deep)}
  .modal{background:rgba(18,58,64,.45);backdrop-filter:blur(3px)}
  .modal .box{box-shadow:0 20px 60px rgba(18,58,64,.25);border-radius:18px}
  a{color:var(--moss)}
  /* login */
  #login{background:radial-gradient(1200px 600px at 50% -10%, #DDF1F3 0%, transparent 60%), radial-gradient(800px 400px at 110% 110%, #E3F3EA 0%, transparent 60%), var(--paper);min-height:100vh;max-width:none}
  #login>*{max-width:380px;width:100%;margin-left:auto;margin-right:auto}
  .loginLogo{display:block;width:170px!important;margin:0 auto 6px!important}
  .tag{color:var(--moss)}
  /* home */
  html{background:var(--paper)}
  body.home{min-height:100vh;background:radial-gradient(900px 420px at 15% -5%, #DDF1F3 0%, transparent 60%), radial-gradient(700px 360px at 100% 0%, #E3F3EA 0%, transparent 55%), var(--paper);background-attachment:fixed}
  .home-hello{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
  .mod{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;position:relative;overflow:hidden}
  .mod::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);opacity:.9}
  .mod:hover{border-color:var(--aqua);box-shadow:0 14px 34px rgba(47,125,135,.18)}
  .mod .ic{background:linear-gradient(135deg,#E3F3EA,#DDF1F5);color:var(--deep)}
  .mod .nm{color:var(--ink)}
  @media (max-width:640px){ body:not(.home) .bname, body:not(.home) #modName{display:none} .brand img{width:30px;height:30px} }
  /* rake operations */
  .rkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:16px}
  .rkc{display:block;text-align:left;height:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink);font-weight:500;cursor:pointer;position:relative;overflow:hidden}
  .rkc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
  .rkc:hover{border-color:var(--aqua);box-shadow:0 10px 26px rgba(47,125,135,.16)}
  .rkc b{font-size:15px}
  .rkm{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 6px;font-size:12.5px;color:var(--slate)}
  .rkm b{color:var(--ink);font-size:14px}
  .clk{margin-top:8px}
  .clkT{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);margin-bottom:4px}
  .clkB{height:8px;border-radius:99px;background:#E9F2F1;overflow:hidden}
  .clkB i{display:block;height:100%;border-radius:99px;transition:width .3s}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .steps span{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--slate)}
  .steps span.done{background:#DDF3EA;border-color:#BFE3D2;color:var(--ok)}
  .steps span.cur{background:var(--grad);border-color:transparent;color:#fff}
  .checks div{padding:4px 0;font-size:14px}
  .warnbox{background:#FFF4E0;border:1px solid #F1D9A6;color:#8a5a14;border-radius:10px;padding:10px 14px;margin:10px 0}
  .lineRow{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;align-items:center;margin-bottom:6px}
  @media (max-width:640px){ .lineRow{grid-template-columns:1fr 100px 40px} .rkgrid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login" class="center">
  <img src="logo.png" alt="SS Logistics — The Goods Way" class="loginLogo">
  <div class="tag">Operations portal</div>
  <button class="primary" id="googleBtn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>
  <div class="muted hide" id="orLine" style="text-align:center;margin:18px 0 12px">or sign in with email and password</div>
  <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="you@gmail.com"></div>
  <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"></div>
  <button class="primary" id="loginBtn" style="width:100%">Sign in</button>
  <p class="muted" style="text-align:center;margin-top:16px" id="loginMsg"></p>
</div>

<div id="app" class="hide">
  <div class="topbar">
    <button class="menuBtn" id="menuBtn" aria-label="Menu">&#9776;</button>

function geo(){ return new Promise(res => { if(!navigator.geolocation) return res({}); navigator.geolocation.getCurrentPosition(p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}), () => res({}), {timeout:6000, maximumAge:60000}); }); }
async function stampImage(file, lines){
  const img = await createImageBitmap(file); const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width*scale; c.height = img.height*scale;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  const fs = Math.max(16, Math.round(c.width/45)); x.font = `bold ${fs}px sans-serif`;
  const h = (fs+8)*lines.length + 10; x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, c.height-h, c.width, h);
  x.fillStyle = '#fff'; lines.forEach((l,i) => x.fillText(l, 12, c.height - h + (fs+8)*(i+1)));
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}
function capture(entityType, entityId, label, allowVideo=false){
  return new Promise((resolve, reject) => {
    const inp = $('camInput'); inp.value=''; inp.accept = allowVideo ? 'image/*,video/*' : 'image/*';
    inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return reject(new Error('No photo taken'));
      try{
        const g = await geo(); const now = new Date(); const isVideo = f.type.startsWith('video');
        const stamp = [label, now.toLocaleString('en-IN'), g.lat ? `GPS ${g.lat}, ${g.lng}` : 'GPS not available'];
        const body = isVideo ? f : await stampImage(f, stamp);
        const path = `${entityType}/${entityId}/${now.getTime()}.${isVideo ? (f.name.split('.').pop()||'mp4') : 'jpg'}`;
        const up = await sb.storage.from('wh-evidence').upload(path, body, {contentType: isVideo ? f.type : 'image/jpeg'});
        if(up.error) throw new Error(up.error.message);
        const {error} = await sb.from('wh_evidence').insert({entity_type:entityType, entity_id:entityId, kind:isVideo?'video':'photo', storage_path:path, taken_at:now.toISOString(), lat:g.lat||null, lng:g.lng||null, uploaded_by:S.me.user_id});
        if(error) throw new Error(error.message);
        toast((isVideo?'Video':'Photo') + ' saved'); resolve(path);
      }catch(e){ toast(e.message,'err',6000); reject(e); }
    };
    inp.click();
  });
}

async function parseRR(file){
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let t=''; for(let i=1;i<=doc.numPages;i++){ const p = await doc.getPage(i); t += (await p.getTextContent()).items.map(x=>x.str).join(' ') + '\n'; }
  const g = re => { const m = t.match(re); return m ? m[1] : null; };
  const iso = s => s ? s.split('-').reverse().join('-') : null;
  return { rr_no:g(/RR No:\s*(\d+)/), rr_date:iso(g(/RR Date:\s*([\d-]+)/)), fnr:g(/FNR:\s*(\d+)/), from_station:g(/Station From:\s*([A-Z]+)/),
           to_station:g(/Station To:\s*([A-Z]+)/), railway_invoice_no:g(/TAX Invoice Number:\s*(\d+)/), invoice_date:iso(g(/Invoice Date:\s*([\d-]+)/)),
           rr_wagon_count:+g(/Wagons:\s*(\d+)/)||null, rr_mt:+g(/Total Weight:\s*([\d.]+)/)||null, rr_bags:+g(/Total:\s*(\d+)/)||null };
}
async function parseWagonSheet(file){
  const wb = XLSX.read(await file.arrayBuffer()); const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  const hi = rows.findIndex(r => r.some(c => typeof c==='string' && /wagon\s*no/i.test(c)));
  if(hi<0) throw new Error('Could not find the "Wagon No." header row in the wagon sheet');
  const h = rows[hi].map(c => (c==null?'':String(c)).trim().toLowerCase()); const col = re => h.findIndex(x => re.test(x));
  const c = {sr:col(/^sr/), wagon:col(/wagon\s*no/), type:col(/wagon\s*type/), bags:col(/bags/), mt:col(/^mt$|tonn|weight/), brand:col(/brand|material|grade/), dest:col(/destination/)};
  const out = [];
  for(const r of rows.slice(hi+1)){
    const wn = r[c.wagon]; if(!wn || !/[A-Z]{2,4}\d{8,}/i.test(String(wn))) continue;
    out.push({sr:+r[c.sr]||out.length+1, wagon_no:String(wn).trim().toUpperCase(), wagon_type:c.type>=0?r[c.type]:null, bags:+r[c.bags], mt:+r[c.mt], material:c.brand>=0?String(r[c.brand]).trim():'', destination:c.dest>=0?r[c.dest]:null});
  }
  return out;
}

    <div style="grid-column:1/-1"><label>Load from</label><select id="sSrc">${sources.length ? sources.map(s=>`<option value="${esc(s.key)}">${esc(s.label)}</option>`).join('') : '<option value="">No stock available</option>'}</select></div>

    <div style="grid-column:span 2"><label>Destination</label><select id="sT" data-mt="shipto" data-mv="sap_code">${destOpts(d.client_id, {exclude:S.loc.id})}</select><div class="muted" id="sSoL" style="margin-top:4px"></div></div>
    <div><label>Labor contractor</label><select id="sL">${contrOpts()}</select></div></div>
    <div class="row"><button class="lime" id="sGo">Add slip</button><button class="primary" id="dConf" ${slips.some(s=>s.status==='open')?'':'disabled'}>Truck loaded → generate challans</button></div>
    <p class="muted">If one batch is short, add a second slip from another batch. The in-charge is accountable if the batch loaded differs from the slip.</p></div>` : `<div class="okbox">Dispatched ${dt(d.dispatched_at)}</div>`}`;
  $('dBack').onclick = () => go();
  m.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => act(b, async () => { await rpc('wh_slip_cancel', {p_slip:b.dataset.cx}); dispatchDetail(m, id); }, 'Slip cancelled'));
  m.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => printSlip(slips.find(s=>s.id===b.dataset.ps), d));
  if(d.status!=='loading') return;
  $('sT').onchange = () => $('sSoL').innerHTML = soldToLine(d.client_id, $('sT').value);
  $('sT')._opts = () => destOpts(d.client_id, {exclude:S.loc.id}); $('sT')._preset = () => ({client_id:d.client_id}); wireAdd(m);
  $('sGo').onclick = e => act(e.target, async () => {
    const [kind, a, bch] = $('sSrc').value.split(':'); if(!kind) throw new Error('Nothing to load from');
    const p = {dispatch_id:id, source: kind==='lot'?'platform_lot':kind, qty_mt:+$('sQ').value, ship_to_code:$('sT').value, contractor_id:$('sL').value};
    if(kind==='wagon') p.wagon_id = a; if(kind==='lot') p.lot_id = a; if(kind==='paltai') p.source_grn_id = a; if(kind==='godown'){ p.material_id = a; p.batch = bch; }
    await rpc('wh_slip_create', {p}); dispatchDetail(m, id);
  }, 'Slip added');
  $('dConf').onclick = e => act(e.target, async () => { const n = await rpc('wh_dispatch_confirm', {p_dispatch:id}); const ch = await q('wh_challans', b => b.eq('dispatch_id', id)); printChallans(ch.map(c=>c.id)); dispatchDetail(m, id); return n; }, n => `${n} challan(s) generated`);
}

function printSlip(s, d){
  printWin(`<div class="pg"><h2>LOADING SLIP ${esc(s.slip_no)}</h2><div>${esc(S.loc.code)} · ${new Date().toLocaleString('en-IN')}</div>

async function printChallans(ids){
  const ch = await q('wh_challans', b => b.in('id', ids)); const lines = await q('wh_challan_lines', b => b.in('challan_id', ids));
  const disp = await q('wh_dispatches', b => b.in('id', [...new Set(ch.map(c=>c.dispatch_id))]));
  printWin(ch.map(c => { const d = disp.find(x=>x.id===c.dispatch_id)||{}; const w = S.plants.find(x=>x.id===c.to_location_id); const p = S.parties.find(x=>x.client_id===c.client_id && x.sap_code===c.ship_to_code) || (w ? {party_name:'SS Logistics · '+w.name, destination:w.code} : {});
    return `<div class="pg"><h2>${c.challan_no.startsWith('ADC')?'ADJUSTMENT CHALLAN (no physical movement)':c.is_damaged?'DELIVERY CHALLAN · DAMAGED BAGS':'DELIVERY CHALLAN'} ${esc(c.challan_no)}</h2><div>${esc(S.loc.code)} · ${new Date(c.created_at).toLocaleString('en-IN')}</div>
    <table><tr><th>Customer</th><td>${esc((S.clients.find(x=>x.id===c.client_id)||{}).name)}</td><th>Truck</th><td>${esc(d.truck_no||'—')}</td></tr>
    <tr><th>Sold-To</th><td>${esc(p.sold_to_name||'')} (${esc(c.sold_to_code||'')})</td><th>Contact</th><td>${esc(p.sold_to_phone||'')}</td></tr><tr><th>Ship-To</th><td>${esc(p.party_name||'')} (${esc(c.ship_to_code)})</td><th>Destination</th><td>${esc([p.destination,p.district,p.state].filter(Boolean).join(', '))}</td></tr><tr><th>Material</th><td colspan="3"><b>${esc(mat(c.material_id))}</b></td></tr></table>
    <table><tr><th>Batch</th><th class="n">MT</th><th class="n">Bags</th></tr>${lines.filter(l=>l.challan_id===c.id).map(l=>`<tr><td>${esc(l.batch)}</td><td class="n">${n3(l.qty_mt)}</td><td class="n">${l.bags??''}</td></tr>`).join('')}
    <tr><th>Total</th><th class="n">${n3(c.qty_mt)} MT</th><th class="n">${c.bags??''} Bags</th></tr></table><p style="margin-top:40px">Driver ____________________ &nbsp;&nbsp; For SS Logistics ____________________</p></div>`; }).join(''));
}

VIEWS.count = async m => {

  const cur = counts.find(c => c.status!=='posted');
  let lines = cur ? await q('wh_count_lines', b => b.eq('count_id', cur.id).order('storage').order('batch')) : [];
  m.innerHTML = `<h1>Monthly stock count · ${esc(S.loc.code)}</h1>
  ${cur ? `<div class="card"><h2>${new Date(cur.count_month).toLocaleDateString('en-IN',{month:'long',year:'numeric'})} · ${chip(cur.status, cur.status==='submitted'?'warn':'info')}</h2>
    ${table([{h:'Location',f:l=>chip(l.storage, l.storage==='damaged'?'bad':'ok')},{h:'Material',f:l=>esc(mat(l.material_id))},{h:'Batch',k:'batch'},{h:'Book MT',n:1,f:l=>n3(l.book_mt)},
      {h:'Physical MT',f:l=>cur.status==='open'?`<input type="number" step="0.001" data-p="${l.id}" value="${l.physical_mt??''}" style="height:36px;width:110px">`:n3(l.physical_mt)},
      {h:'Difference',n:1,f:l=>l.diff_mt?`<b style="color:${l.diff_mt<0?'var(--alert)':'var(--ok)'}">${n3(l.diff_mt)}</b>`:''},
      {h:'Reason',f:l=>cur.status==='open'?`<select data-r="${l.id}" style="height:36px"><option value="">—</option><option value="damage" ${l.reason==='damage'?'selected':''}>Damage</option><option value="shortage" ${l.reason==='shortage'?'selected':''}>Shortage</option><option value="count_error" ${l.reason==='count_error'?'selected':''}>Count error (recount)</option></select>`:esc(l.reason||'')}], lines)}
    <div class="row" style="margin-top:10px">${cur.status==='open'?'<button class="ghost" id="cSave">Save counts</button><button class="primary" id="cSub">Submit</button>':''}${cur.status==='submitted'&&can('wh_variance_approve')?'<button class="primary" id="cPost">Approve & post adjustments</button>':''}</div></div>`
  : `<div class="card"><div class="grid"><div><label>Month</label><input type="month" id="cM" value="${today().slice(0,7)}"></div></div><button class="primary" id="cStart">Start count sheet</button></div>`}
  <div class="card"><h2>Past counts</h2>${table([{h:'Month',f:c=>new Date(c.count_month).toLocaleDateString('en-IN',{month:'short',year:'numeric'})},{h:'Status',f:c=>chip(c.status)},{h:'Posted',f:c=>dt(c.posted_at)}], counts.filter(c=>c.status==='posted'))}</div>`;
  if($('cStart')) $('cStart').onclick = e => act(e.target, async () => { await rpc('wh_count_start', {p_location:S.loc.id, p_month:$('cM').value+'-01'}); go(); }, 'Count sheet created from book stock');
  const save = async () => { for(const l of lines){ const p = document.querySelector(`[data-p="${l.id}"]`).value; const r = document.querySelector(`[data-r="${l.id}"]`).value; if(p==='' ) continue; if(+p!==+l.physical_mt || (r||null)!==(l.reason||null)) await rpc('wh_count_enter', {p_line:l.id, p_physical:+p, p_reason:r||null, p_note:null}); } };
  if($('cSave')) $('cSave').onclick = e => act(e.target, async () => { await save(); go(); }, 'Saved');

/* ============ SAP BILLING ============ */
function parseSapRows(rows){
  const hi = rows.findIndex(r => r.some(c => /^invoice no$/i.test(String(c||'').trim())));
  if(hi<0) throw new Error('Could not find the "INVOICE NO" column — is this the SAP billing export?');
  const H = rows[hi].map(c => String(c||'').trim().toUpperCase());
  const col = name => H.indexOf(name);
  const pick = (r, name) => { const i = col(name); return i<0 ? null : (r[i]==null ? null : String(r[i]).trim()); };
  const iso = v => { if(!v) return null; if(/^\d{2}-\d{2}-\d{4}$/.test(v)) return v.split('-').reverse().join('-'); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); if(/^\d+(\.\d+)?$/.test(v)){ const d = XLSX.SSF.parse_date_code(+v); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; } return v; };
  return rows.slice(hi+1).filter(r => pick(r,'INVOICE NO')).map(r => ({
    invoice_no:pick(r,'INVOICE NO'), cancelled_invoice:pick(r,'CANCELLED INVOICE'), invoice_date:iso(pick(r,'INVOICE DATE')), gi_date:iso(pick(r,'ACTUAL GI DATE')),
    truck_no:pick(r,'TRUCK NO'), sold_to_code:pick(r,'SOLD TO PARTY'), ship_to_code:pick(r,'SHIP TO PARTY'), product_code:pick(r,'PRODUCT'), product_description:pick(r,'PRODUCT DESCRIPTION'),
    qty:+String(pick(r,'QTY')||'0').replace(/,/g,''), uom:pick(r,'UOM'), so_no:pick(r,'SO/PO NUMBER'), delivery_no:pick(r,'DELIVERY NO'), shipment_no:pick(r,'SHIPMENT NO'),
    batch_no:pick(r,'BATCH NO'), plant:pick(r,'PLANT'), transporter:pick(r,'TRANSPORTER NAME'), shipment_amount:pick(r,'SHIPMENT AMOUNT') }));
}

  const tag = async s => { const [i,c,qv] = s.split('|'); await rpc('wh_tag', {p_invoice:i, p_challan:c, p_qty:+qv}); };

const sardarOpts = sel => opt(S.sardars.filter(x => S.loc && x.siding_id===S.loc.id && x.is_active).map(x => ({id:x.id, n:sardarName(x.id)})), 'id', 'n', sel, 'Select Labour Sardar');
const plantCode = id => (S.plants.find(p => p.id===id)||{}).code || '';
const localDT = d => { const x = d ? new Date(d) : new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,16); };
const isoDT = v => v ? new Date(v).toISOString() : null;
const bearerTxt = b => b==='ssl' ? 'SSL bears DC/WC' : b==='customer' ? 'Customer bears DC/WC' : 'DC/WC bearer not set';
const rkBearer = (clientId) => (S.terms.find(x => x.siding_id===S.loc.id && x.client_id===clientId) || {}).dcwc_bearer;
function clockBar(pct, running, label){
  if(pct==null) return '';
  const c = pct>=90 ? 'var(--alert)' : pct>=75 ? '#D97F06' : pct>=50 ? '#B89400' : 'var(--moss)';
  return `<div class="clk"><div class="clkT"><span>${esc(label)}</span><b style="color:${c}">${pct}% ${running?'· running':''}</b></div><div class="clkB"><i style="width:${Math.min(100,pct)}%;background:${c}"></i></div></div>`;
}
function rakeCard(r){
  const c = r.calc || {};
  return `<button class="rkc" data-rk="${r.id}"><div class="row" style="justify-content:space-between"><b>${esc(r.rake_no)}</b>${rkChip(r.status)}</div>
    <div class="muted" style="margin-top:4px">${esc(r.client_code)} · ${esc(r.category)} · for ${esc(r.warehouse_code)} · from ${esc(r.source_siding)}</div>
    <div class="rkm"><span>Wagons <b>${r.wagons ? `${r.wagons_empty}/${r.wagons}` : r.planned_wagons}</b></span><span>MT <b>${n3(r.rr_mt || r.planned_mt)}</b></span><span>On platform <b>${n3(r.lot_mt)}</b></span></div>
    ${['planned','wagons_updated'].includes(r.status) ? `<div class="muted">Expected ${r.expected_arrival ? dt(r.expected_arrival) : '—'}</div>` : ''}
    ${clockBar(c.dc_used_pct, c.dc_running, 'Demurrage free time used')}${clockBar(c.wc_used_pct, c.wc_running, 'Wharfage free time used')}</button>`;
}

VIEWS.rk_board = async m => {
  if(!S.loc){ m.innerHTML = '<div class="empty">No siding is assigned to you yet. Ask the administrator to add your siding.</div>'; return; }
  const rows = await q('rk_rake_list', b => b.eq('siding_id', S.loc.id).order('created_at', {ascending:false}).limit(100));
  const open = rows.filter(r => r.status!=='closed'), closed = rows.filter(r => r.status==='closed');
  const alert = open.filter(r => (r.calc||{}).dc_running && (r.calc.dc_used_pct||0)>=75 || (r.calc||{}).wc_running && (r.calc.wc_used_pct||0)>=75);
  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1>Rakes · ${esc(S.loc.code)}</h1>${can('rk_rake_create') ? '<button class="primary" id="rkPlan">+ Plan rake</button>' : ''}</div>
    ${alert.length ? `<div class="warnbox"><b>Free time running out:</b> ${alert.map(r => esc(r.rake_no)).join(', ')}</div>` : ''}
    <div class="rkgrid">${open.map(rakeCard).join('') || '<div class="empty">No open rakes. Plan one from the customer\'s intimation.</div>'}</div>
    <div class="card"><h2>Closed rakes</h2>${table([{h:'Rake',f:r=>`<a href="#" data-rk="${r.id}"><b>${esc(r.rake_no)}</b></a>`},{h:'Customer',k:'client_code'},{h:'RR / FNR',f:r=>`${esc(r.rr_no||'')} / ${esc(r.fnr||'')}`},{h:'MT',n:1,f:r=>n3(r.rr_mt)},{h:'Placed',f:r=>dt(r.placed_at)},{h:'Closed',f:r=>dt(r.closed_at)}], closed.slice(0,40), 'No closed rakes yet.')}</div>`;
  if($('rkPlan')) $('rkPlan').onclick = () => rkPlanForm(null, id => rkDetail(m, id));
  m.querySelectorAll('[data-rk]').forEach(a => a.onclick = e => { e.preventDefault(); rkDetail(m, a.dataset.rk); });
};

  const upd = () => {
    const cid = $('pC').value; const cats = S.cats.filter(c => c.client_id===cid && c.is_active);
    $('pCat').innerHTML = opt(cats, 'id', c => `${c.name} (${c.code})`, r.category_id || (cats.length===1 ? cats[0].id : ''), cats.length===1 ? undefined : 'Select category') + addOpt('cat'); $('pCat').dataset.prev = $('pCat').value;
    $('pCatW').style.display = cats.length===1 ? 'none' : '';
    $('pW').innerHTML = whOpts(cid);
    const b = cid ? rkBearer(cid) : null; $('pB').innerHTML = cid ? (b ? bearerTxt(b) : '<span style="color:var(--alert)">Set who bears DC/WC for this customer at this siding in Siding setup before planning.</span>') + (cats.length ? '' : ' · <span style="color:var(--alert)">This customer has no material category yet.</span>') : '';
  };
  $('pC').onchange = () => { r.category_id = null; r.warehouse_id = null; upd(); }; upd();
  $('pCat')._opts = () => opt(S.cats.filter(c => c.client_id===$('pC').value && c.is_active), 'id', c => `${c.name} (${c.code})`, undefined, 'Select category');
  $('pCat')._preset = () => ({client_id:$('pC').value}); wireAdd($('modalBox'));
  $('pGo').onclick = e => act(e.target, async () => {
    const p = {siding_id:S.loc.id, client_id:$('pC').value, category_id:$('pCat').value, warehouse_id:$('pW').value, source_siding:$('pS').value,
               planned_wagons:+$('pN').value||null, planned_mt:+$('pQ').value||null, expected_arrival:isoDT($('pE').value), note:$('pNote').value};
    const id = isNew ? await rpc('rk_rake_plan', {p}) : await rpc('rk_rake_edit', {p:{...p, id:r.id}});
    closeModal(); after && after(id);

async function rkDetail(m, id){
  const [r] = await q('rk_rake_list', b => b.eq('id', id));
  if(!r){ m.innerHTML = '<div class="issues">Rake not found or not at your siding.</div>'; return; }
  const [wagons, uslips, lot, diffs, msgs, events, tlines] = await Promise.all([
    q('rk_wagons', b => b.eq('rake_id', id).order('sheet_sr')), q('rk_unload_slips', b => b.eq('rake_id', id).order('created_at')),
    q('rk_lot_balance', b => b.eq('rake_id', id)), q('rk_platform_diffs', b => b.eq('rake_id', id).order('created_at')),
    q('wh_messages', b => b.eq('rake_id', id).order('created_at')), q('rk_rake_events', b => b.eq('rake_id', id).order('at', {ascending:false})),
    q('rk_truck_lines', b => b.eq('rake_id', id))]);
  const wids = wagons.map(w => w.id);
  const [phB, phA, phD, phW] = await Promise.all([evidenceCount('rk_wagon_before', wids), evidenceCount('rk_wagon_after', wids), evidenceCount('rk_wagon_damage', wids), evidenceCount('rk_waiver', [id])]);
  const c = r.calc || {}; const si = rkIdx(r.status); const W = x => wagons.find(w => w.id===x);
  const openSlip = wid => uslips.find(u => u.wagon_id===wid && u.status==='open');
  const back = () => rkDetail(m, id);
  const truckMt = wid => tlines.filter(l => l.wagon_id===wid && l.actual_mt!=null).reduce((a,l) => a + +l.actual_mt, 0);
  const unlMt = wid => uslips.filter(u => u.wagon_id===wid && u.status==='returned').reduce((a,u) => a + +u.good_mt + +u.damaged_mt, 0);

  let h = `<div class="row" style="justify-content:space-between"><h1>${esc(r.rake_no)} · ${esc(r.client_name)}</h1><button class="ghost sm" id="rkBack">All rakes</button></div>
  <div class="steps">${RK_STEPS.map(([k,l],i) => `<span class="${i<si?'done':i===si?'cur':''}">${i<si?'✓ ':''}${esc(l)}</span>`).join('')}</div>
  <div class="kpi"><div><span>RR / FNR</span><b style="font-size:15px">${esc(r.rr_no||'—')} / ${esc(r.fnr||'—')}</b></div><div><span>Batch</span><b>${esc(r.batch||'—')}</b></div>
   <div><span>Wagons empty</span><b>${r.wagons ? `${r.wagons_empty}/${r.wagons}` : '—'}</b></div><div><span>Missing</span><b style="color:${r.wagons_missing?'var(--alert)':'inherit'}">${r.wagons_missing}</b></div>
   <div><span>On platform MT</span><b>${n3(r.lot_mt)}</b></div><div><span>DC + WC (system)</span><b>${inr((+c.dc_calc||0) + (+c.wc_calc||0))}</b></div></div>`;

  // intimation
  h += `<div class="card"><div class="row" style="justify-content:space-between"><h2>Intimation</h2><div class="row">
      ${['planned','wagons_updated'].includes(r.status) && can('rk_rake_edit') ? '<button class="ghost sm" id="rkEdit">Edit</button>' : ''}
      ${['planned','wagons_updated'].includes(r.status) && can('rk_rake_delete') ? '<button class="ghost sm" id="rkDel">Delete</button>' : ''}</div></div>
    <div class="grid"><div><label>From</label>${esc(r.source_siding)}</div><div><label>Placement siding</label>${esc(r.siding_code)}</div><div><label>For warehouse</label>${esc(r.warehouse_code)} · ${esc(r.warehouse_name)}</div>
     <div><label>Category</label>${esc(r.category)}</div><div><label>Planned</label>${r.planned_wagons} wagons · ${n3(r.planned_mt)} MT</div><div><label>Expected</label>${r.expected_arrival?dt(r.expected_arrival):'—'}</div>
     <div><label>DC / WC</label>${bearerTxt(r.dcwc_bearer)}</div>${r.note?`<div><label>Note</label>${esc(r.note)}</div>`:''}</div></div>`;

  // RR + wagon sheet
  if(['planned','wagons_updated'].includes(r.status) && can('rk_wagons_update')){
    h += `<div class="card"><h2>${r.status==='planned' ? 'Add RR and wagon sheet' : 'Replace RR / wagon sheet'}</h2><div class="grid">
      <div><label>RR PDF</label><input type="file" id="rkPdf" accept="application/pdf"></div>
      <div><label>Wagon sheet</label><input type="file" id="rkSheet" accept=".xlsx,.xls,.csv"></div>
      <div><label>Other destination's sheet (optional, duplicate check)</label><input type="file" id="rkSib" accept=".xlsx,.xls,.csv"></div></div>
      <div class="grid" id="rkHead" style="margin-top:10px">
      ${['rr_no:RR No','fnr:FNR','rr_date:RR date:date','railway_invoice_no:Railway invoice no','invoice_date:Invoice date:date','rr_wagon_count:Wagons (RR):number','rr_bags:Bags (RR):number','rr_mt:MT (RR):number'].map(x => { const [k,l,t] = x.split(':'); return `<div><label>${l}</label><input id="h_${k}" type="${t||'text'}" step="any" value="${esc(r[k]??'')}"></div>`; }).join('')}
      </div><p class="muted" id="rkBatch"></p><div id="rkWagonsNew"></div><div id="rkIssues"></div>
      <button class="primary" id="rkSaveW">Save wagons</button></div>`;
  }
  // arrival
  if(r.status==='wagons_updated' && can('rk_arrival')){
    h += `<div class="card"><h2>Mark arrival</h2><p class="muted">Untick wagons that were not placed. Free time and rates are what the railway gave for this rake.</p>
      <div class="grid"><div><label>Arrived at siding</label><input type="datetime-local" id="aA" value="${localDT()}"></div><div><label>Placed</label><input type="datetime-local" id="aP" value="${localDT()}"></div>

      <div><label>Penal DC in force?</label><select id="aPen"><option value="">Choose…</option><option value="false">No</option><option value="true">Yes</option></select></div>
      <div><label>DC rate (₹ per wagon per hour)</label><input type="number" step="0.01" id="aDR"></div><div><label>WC rate (₹ per MT per hour)</label><input type="number" step="0.01" id="aWR"></div>
      <div><label>Rate note</label><input id="aRN" placeholder="e.g. penal DC notice no."></div></div>
      ${table([{h:'Placed',f:w=>`<input type="checkbox" data-pl="${w.id}" checked>`},{h:'Sr',k:'sheet_sr'},{h:'Wagon',k:'wagon_no'},{h:'Type',f:w=>esc(mat(w.material_id))},{h:'Position',f:w=>`<input type="number" data-pos="${w.id}" value="${w.sheet_sr}" style="width:90px;height:36px">`}], wagons)}

  }
  // wagons
  if(si >= rkIdx('arrived')){
    h += `<div class="card"><h2>Wagons</h2>${table([

      {h:'Found',f:w=>w.found_material_id ? (w.found_material_id!==w.material_id ? chip(mat(w.found_material_id)+' ≠ sheet','bad') : esc(mat(w.found_material_id))) : ''},
      {h:'Status',f:w=>w.status==='missing'?chip('missing','bad'):w.status==='empty'?chip('empty','ok'):w.status==='unloading'?chip('unloading','info'):chip(w.status)},

      {h:'Damage',f:w=>w.damage_note?chip(w.damage_note,'warn'):''},
      {h:'Photos',f:w=>`<a href="#" data-ev="${w.id}">${phB[w.id]||0} before · ${phA[w.id]||0} after${phD[w.id]?' · '+phD[w.id]+' damage':''}</a>`},
      {h:'',f:w=>{
        if(r.status==='closed') return '';
        if(w.status==='missing') return can('rk_arrival') && ['arrived','unloading','unloaded'].includes(r.status) ? `<button class="ghost sm" data-late="${w.id}">Arrived late</button>` : '';
        if(w.status==='arrived') return can('rk_unload') ? `<button class="lime sm" data-ph="rk_wagon_before" data-w="${w.id}">📷 Before</button> <button class="primary sm" data-start="${w.id}" ${phB[w.id]?'':'disabled title="Take the before-unloading photo first"'}>Start unloading</button>` : '';
        if(w.status==='unloading'){ const u = openSlip(w.id); let x = '';
          if(can('rk_unload')) x += u ? `<button class="primary sm" data-uret="${u.id}">Return slip ${esc(u.slip_no.split('/').pop())}</button> ` : `<button class="ghost sm" data-uslip="${w.id}">Unloading slip</button> `;
          if(can('rk_unload')) x += `<button class="ghost sm" data-dmg="${w.id}">Damage</button> `;
          if(can('rk_wagon_close')) x += `<button class="lime sm" data-ph="rk_wagon_after" data-w="${w.id}">📷 After</button> <button class="ghost sm" data-empty="${w.id}" ${phA[w.id]?'':'disabled title="Take the empty-wagon photo first"'}>Mark empty</button>`;
          return x; }
        return '';
      }}], wagons)}</div>`;
    h += `<div class="card"><h2>Unloading slips</h2>${table([{h:'Slip',k:'slip_no'},{h:'Wagon',f:u=>esc((W(u.wagon_id)||{}).wagon_no)},{h:'Sardar',f:u=>esc(sardarName(u.sardar_id))},{h:'Company MT',n:1,f:u=>n3(u.company_mt)},
      {h:'Good MT',n:1,f:u=>u.status==='returned'?n3(u.good_mt):''},{h:'Damaged MT',n:1,f:u=>u.status==='returned'&&+u.damaged_mt?n3(u.damaged_mt):''},{h:'Status',f:u=>chip(u.status, u.status==='returned'?'ok':u.status==='open'?'info':'')},

    h += `<div class="card"><div class="row" style="justify-content:space-between"><h2>Platform lot</h2>${can('rk_truck') && ['arrived','unloading','unloaded','released'].includes(r.status) ? '<button class="primary sm" id="rkTruck">+ Load a truck</button>' : ''}</div>
      ${table([{h:'Type',k:'material'},{h:'Condition',f:x=>x.kind==='damaged'?chip('damaged','bad'):chip('good','ok')},{h:'On platform MT',n:1,f:x=>n3(x.balance_mt)},{h:'On open trucks MT',n:1,f:x=>+x.reserved_mt?n3(x.reserved_mt):''},{h:'Free MT',n:1,f:x=>n3(x.available_mt)}], lot, 'Nothing unloaded to the platform yet.')}</div>`;
  }
  // times
  if(si >= rkIdx('arrived')){

    h += `<div class="card"><div class="row" style="justify-content:space-between"><h2>Times</h2><div class="row">

      ${r.status==='released' && can('rk_release_clear') ? '<button class="primary sm" id="rkClr">Record platform clear</button>' : ''}

      <div class="grid">${T.map(([k,l]) => `<div><label>${esc(l)}</label>${r[k] ? dt(r[k]) : '<span class="muted">—</span>'}</div>`).join('')}</div></div>`;
    h += `<div class="card"><div class="row" style="justify-content:space-between"><h2>Demurrage (DC) and wharfage (WC)</h2>${r.status!=='closed' && can('rk_arrival') ? '<button class="ghost sm" id="rkTerms">Change free time / rates</button>' : ''}</div>
      <p class="muted">${bearerTxt(r.dcwc_bearer)}. Measured on every rake whoever pays.${r.penal_dc ? ' ' + chip('Penal DC in force','bad') : ''}${r.rate_note ? ' · ' + esc(r.rate_note) : ''}</p>
      ${clockBar(c.dc_used_pct, c.dc_running, `DC: ${c.dc_hours ?? '—'} h used of ${r.dc_free_hours ?? '—'} h free`)}${clockBar(c.wc_used_pct, c.wc_running, `WC: ${c.wc_hours ?? '—'} h used of ${r.wc_free_hours ?? '—'} h free`)}

  }

async function rkTruckForm(clientId, after){
  const rakes = (await q('rk_rake_list', b => b.eq('siding_id', S.loc.id))).filter(x => ['arrived','unloading','unloaded','released'].includes(x.status));
  const clients = S.clients.filter(c => rakes.some(x => x.client_id===c.id));
  if(!clients.length){ toast('No rake is being unloaded at this siding', 'warn'); return; }
  const cid0 = clientId || clients[0].id;
  modal(`<h2>Load a truck · ${esc(S.loc.code)}</h2><div class="grid">
    <div><label>Customer</label><select id="tC">${opt(clients,'id','name',cid0)}</select></div>
    <div><label>Labour Sardar</label><select id="tS" data-mt="sardar">${sardarOpts()}</select></div>
    <div><label>Truck kind</label><select id="tK"><option value="market">Market</option><option value="vendor">Vendor</option><option value="own">SSL own</option><option value="dealer">Dealer's own</option></select></div>
    <div><label>Truck no</label><input id="tT" list="ownTrucks3"><datalist id="ownTrucks3">${S.trucks.map(t=>`<option value="${esc(t.registration_no)}">`).join('')}</datalist></div>
    <div id="tVW" class="hide"><label>Vendor</label><select id="tV" data-mt="vendor">${opt(S.vendors,'id','vendor_name','', 'Select vendor')}</select></div>
    <div><label>Driver</label><input id="tD"></div>
    <div><label class="row" style="margin-top:18px;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" id="tDmg"> Damaged bags (to our warehouse)</label></div>
    <div style="grid-column:1/-1"><label>Destination</label><select id="tP" data-mt="shipto" data-mv="sap_code"></select><div class="muted" id="tSo" style="margin-top:4px"></div></div></div>
    <h2 style="margin-top:14px">Load from</h2><div class="row"><select id="tSrc" style="flex:1 1 260px"></select><button class="lime sm" id="tAdd">Add line</button></div>
    <div id="tLines" style="margin-top:10px"></div>
    <div class="row" style="margin-top:12px"><button class="primary" id="tGo">Create & print slip</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`);
  let wag = [], lotRows = []; const L = [];
  const load = async () => {
    const cid = $('tC').value; const mine = rakes.filter(x => x.client_id===cid);
    [wag, lotRows] = mine.length ? await Promise.all([q('rk_wagons', b => b.in('rake_id', mine.map(x=>x.id)).eq('status','unloading').order('position')), q('rk_lot_balance', b => b.in('rake_id', mine.map(x=>x.id)))]) : [[],[]];
    const dmg = $('tDmg').checked; const kind = dmg ? 'damaged' : 'good';
    const src = [...(dmg ? [] : wag.map(w => ({v:'w:'+w.id, l:`Wagon ${w.wagon_no} · ${mat(w.found_material_id)} · ${(mine.find(x=>x.id===w.rake_id)||{}).rake_no}`}))),
      ...lotRows.filter(x => x.kind===kind && +x.available_mt > 0).map(x => ({v:`p:${x.rake_id}:${x.material_id}`, l:`Platform · ${(mine.find(y=>y.id===x.rake_id)||{}).rake_no} · ${x.material} ${kind} · ${n3(x.available_mt)} MT free`}))];
    $('tSrc').innerHTML = src.length ? src.map(x => `<option value="${esc(x.v)}">${esc(x.l)}</option>`).join('') : '<option value="">Nothing to load</option>';
    $('tP').innerHTML = destOpts(cid, {siding:S.loc.id, warehouseOnly:dmg}) + (dmg ? '' : addOpt('shipto')); $('tP').dataset.prev = '';
    L.length = 0; drawL();
  };
  const drawL = () => { $('tLines').innerHTML = L.map((x,i) => `<div class="lineRow"><div>${esc(x.label)}</div><input type="number" step="0.001" placeholder="MT" data-lq="${i}" value="${x.planned_mt||''}"><button class="ghost sm" data-lx="${i}">✕</button></div>`).join('') || '<div class="muted">Add at least one wagon or platform line. One truck can load from several wagons and the platform.</div>';
    document.querySelectorAll('[data-lq]').forEach(i => i.oninput = () => L[+i.dataset.lq].planned_mt = +i.value);
    document.querySelectorAll('[data-lx]').forEach(b => b.onclick = () => { L.splice(+b.dataset.lx, 1); drawL(); }); };
  $('tC').onchange = load; $('tDmg').onchange = load;
  $('tS')._opts = () => sardarOpts(); $('tP')._opts = () => destOpts($('tC').value, {siding:S.loc.id, warehouseOnly:$('tDmg').checked});
  $('tP')._preset = () => ({client_id:$('tC').value}); wireAdd($('modalBox'));
  $('tK').onchange = () => $('tVW').classList.toggle('hide', $('tK').value!=='vendor');
  $('tP').onchange = () => $('tSo').innerHTML = soldToLine($('tC').value, $('tP').value);
  $('tAdd').onclick = () => { const v = $('tSrc').value; if(!v) return; const label = $('tSrc').selectedOptions[0].textContent; const [k,a,b2] = v.split(':');
    if(L.some(x => x.key===v)) return toast('Already added', 'warn');
    L.push(k==='w' ? {key:v, label, source:'wagon', wagon_id:a} : {key:v, label, source:'platform', rake_id:a, material_id:b2}); drawL(); };
  await load();
  $('tGo').onclick = e => act(e.target, async () => {
    const own = $('tK').value==='own'; const tr = S.trucks.find(t => t.registration_no===$('tT').value.trim().toUpperCase());
    if(own && !tr) throw new Error('Own truck not found in the truck master');
    const p = {siding_id:S.loc.id, client_id:$('tC').value, sardar_id:$('tS').value, truck_kind:$('tK').value, truck_no:$('tT').value, truck_id:own?tr.id:null,
      vendor_id:$('tK').value==='vendor'?$('tV').value||null:null, driver_name:$('tD').value, ship_to_code:$('tP').value, is_damaged:$('tDmg').checked,
      lines:L.map(x => ({source:x.source, wagon_id:x.wagon_id, rake_id:x.rake_id, material_id:x.material_id, planned_mt:x.planned_mt}))};
    const id = await rpc('rk_truck_create', {p}); closeModal();
    const [t] = await q('rk_truck_slips', b => b.eq('id', id)); const lines = await q('rk_truck_lines', b => b.eq('truck_slip_id', id));
    printTruckSlip(t, lines, rakes, wag); after && after(id);
  }, 'Truck slip created');
}

async function rkTruckDetail(m, id){
  const [t] = await q('rk_truck_slips', b => b.eq('id', id)); const lines = await q('rk_truck_lines', b => b.eq('truck_slip_id', id));
  const rakes = await q('rk_rakes', b => b.in('id', [...new Set(lines.map(l => l.rake_id))]));
  const wagons = await q('rk_wagons', b => b.in('id', lines.filter(l => l.wagon_id).map(l => l.wagon_id).concat(['00000000-0000-0000-0000-000000000000'])));
  const src = l => l.source==='wagon' ? 'Wagon ' + ((wagons.find(w => w.id===l.wagon_id)||{}).wagon_no||'') : 'Platform · ' + ((rakes.find(x => x.id===l.rake_id)||{}).rake_no||'');
  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1>${esc(t.slip_no)} · <span class="plate">${esc(t.truck_no)}</span> ${chip(t.truck_kind)}${t.is_damaged?' '+chip('damaged bags','bad'):''}</h1><button class="ghost sm" id="tBack">Back</button></div>
    <div class="card"><div class="grid"><div><label>Customer</label>${esc(clientCode(t.client_id))}</div><div><label>Ship-To</label>${esc(t.ship_to_code)}${t.to_location_id?' '+chip('our warehouse · GRN','info'):''}</div><div><label>Sardar</label>${esc(sardarName(t.sardar_id))}</div><div><label>Driver</label>${esc(t.driver_name||'—')}</div><div><label>Status</label>${chip(t.status, t.status==='dispatched'?'ok':t.status==='open'?'info':'')}</div></div>
    <div class="muted" style="margin-top:6px">${soldToLine(t.client_id, t.ship_to_code)}</div></div>
    <div class="card"><h2>${t.status==='open' ? 'Labour-confirmed quantity' : 'Loaded'}</h2>${table([{h:'From',f:l=>esc(src(l))},{h:'Type',f:l=>esc(mat(l.material_id))},{h:'Planned MT',n:1,f:l=>n3(l.planned_mt)},
      {h:'Bags loaded',n:1,f:l=>t.status==='open'?`<input type="number" data-lb="${l.id}" style="width:110px;height:36px">`:(l.actual_bags??'')},
      {h:'MT loaded',n:1,f:l=>t.status==='open'?`<input type="number" step="0.001" data-lm="${l.id}" value="${n3(l.planned_mt)}" style="width:120px;height:36px">`:n3(l.actual_mt)}], lines)}
    ${t.status==='open' ? `<div class="row" style="margin-top:10px"><button class="ghost sm" id="tPr">Print slip</button>${can('rk_truck') ? '<button class="primary" id="tConf">Labour confirmed → generate challans</button><button class="ghost sm" id="tCx">Cancel slip</button>' : ''}</div>
      <p class="muted">The quantity the labour writes on the returned slip goes on the delivery challan.</p>` : t.status==='dispatched' ? `<button class="ghost sm" id="tCh" style="margin-top:10px">Print challans</button>` : ''}</div>`;
  $('tBack').onclick = () => go();
  if($('tPr')) $('tPr').onclick = () => printTruckSlip(t, lines, rakes, wagons);
  const bpm = l => { const w = wagons.find(x => x.id===l.wagon_id); return w && +w.sheet_mt ? w.sheet_bags / w.sheet_mt : 20; };
  m.querySelectorAll('[data-lb]').forEach(i => i.oninput = () => { const l = lines.find(x => x.id===i.dataset.lb); if(i.value) m.querySelector(`[data-lm="${l.id}"]`).value = (+i.value / bpm(l)).toFixed(3); });
  if($('tConf')) $('tConf').onclick = e => act(e.target, async () => {
    const p = lines.map(l => ({id:l.id, actual_mt:m.querySelector(`[data-lm="${l.id}"]`).value===''?null:+m.querySelector(`[data-lm="${l.id}"]`).value, actual_bags:m.querySelector(`[data-lb="${l.id}"]`).value===''?null:+m.querySelector(`[data-lb="${l.id}"]`).value}));

    const ch = await q('wh_challans', b => b.eq('dispatch_id', t2.dispatch_id)); printChallans(ch.map(c => c.id)); rkTruckDetail(m, id); return n;
  }, n => `${n} challan(s) generated`);
  if($('tCx')) $('tCx').onclick = e => { if(confirm('Cancel this truck slip?')) act(e.target, async () => { await rpc('rk_truck_cancel', {p_slip:id}); go(); }, 'Cancelled'); };
  if($('tCh')) $('tCh').onclick = async () => { const ch = await q('wh_challans', b => b.eq('dispatch_id', t.dispatch_id)); printChallans(ch.map(c => c.id)); };
}

// makes every <select data-mt="…"> inside root offer "+ Add new"; s._opts may give its own option list, data-mv the value column
function wireAdd(root){
  root.querySelectorAll('select[data-mt]').forEach(s => {
    if(s._wired) return; s._wired = true;
    if(!s.querySelector(`option[value="${ADD_NEW}"]`)) s.insertAdjacentHTML('beforeend', addOpt(s.dataset.mt));
    s.dataset.prev = s.value;
    s.addEventListener('change', () => {
      if(s.value !== ADD_NEW){ s.dataset.prev = s.value; return; }
      s.value = s.dataset.prev || '';
      quickAdd(s.dataset.mt, row => {
        const t = s.dataset.mt;
        s.innerHTML = (s._opts ? s._opts() : '<option value=""></option>' + typeOpts(t)) + addOpt(t);
        s.value = row ? row[s.dataset.mv || 'id'] : ''; s.dataset.prev = s.value;
        s.dispatchEvent(new Event('change'));
      }, s._preset ? s._preset() : null);
    });
  });
}

  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1>${grp==='rk' ? 'Siding setup' : grp==='wh' ? 'Warehouse setup' : 'Master data'}</h1><select id="mS" style="width:auto">${keys.map(k=>`<option ${k===S.mst?'selected':''}>${k}</option>`).join('')}</select></div>
  <div class="card"><h2>Add ${esc(S.mst)}</h2>${M.note?`<p class="muted">${esc(M.note)}</p>`:''}<div class="grid" id="mForm">${M.form.map(f => masterInput(f, 'f_')).join('')}</div><button class="primary" id="mAdd" style="margin-top:8px">Add</button></div>
  <div class="card">${table(M.cols.map(k => ({h:(M.labels||{})[k] || k.replace(/_id$/,'').replace(/_/g,' '), f:r => show(k, r[k])})).concat(EDIT_CFG[S.mst] && masterPerm(M) ? [{h:'', f:r => EDIT_CFG[S.mst].remove ? `<button class="ghost sm" data-rm="${rows.indexOf(r)}">Remove</button>` : `<button class="ghost sm" data-edit="${rows.indexOf(r)}">Edit</button>` + (S.me.admin && r.id ? ` <button class="danger sm" data-del="${rows.indexOf(r)}">Delete</button>` : '')}] : []), rows)}</div>
  ${!EDIT_CFG[S.mst] && /rate|conversion/i.test(S.mst) ? '<p class="muted">Rates are effective-dated: to change one, add a new row with a new effective date.</p>' : ''}`;
  m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editMaster(S.mst, rows[+b.dataset.edit], () => go()));
  m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const r = rows[+b.dataset.del]; const label = r.code || r.name || r.vendor_name || r.registration_no || r.sap_product_code || 'this record';
    if(!confirm(`Delete ${label} permanently? This cannot be undone. If it is used anywhere, set it Inactive instead.`)) return;
    act(b, async () => { const {data, error} = await sb.from(M.t).delete().eq('id', r.id).select();
      if(error) throw new Error(/foreign key/i.test(error.message) ? `${label} is used in other records and cannot be deleted. Edit it and set it Inactive instead.` : error.message);
      if(!data || !data.length) throw new Error('Only the Administrator can delete');
      await loadMasters(); if(M.t==='sys_plants'){ S.me = await rpc('wh_me'); S.locs = S.me.locations; } go(); }, 'Deleted');
  });
  m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if(!confirm('Remove this link?')) return; const r = rows[+b.dataset.rm]; act(b, async () => { let qb = sb.from(M.t).delete(); EDIT_CFG[S.mst].key.forEach(k => qb = qb.eq(k, r[k])); const {error} = await qb; if(error) throw new Error(error.message); await loadMasters(); go(); }, 'Removed'); });
  $('mS').onchange = () => { S.mst = $('mS').value; go(); };
  setupMasterForm(M, 'f_', $('mForm')); wireAdd($('mForm'));
  $('mAdd').onclick = e => act(e.target, async () => { await saveMaster(M, 'f_', $('mForm')); go(); }, 'Saved');
};
/* ============ MY PROFILE ============ */
VIEWS.profile = async m => {
  const me = await rpc('wh_me'); const p = me.profile || {};
  const perms = await q('sys_permissions', b => b.order('module').order('sort'));
  m.innerHTML = `<h1>My profile</h1>
  <div class="card"><div class="grid">
    <div><label>Email (login)</label><input value="${esc(p.email)}" disabled></div>
    <div><label>Full name</label><input id="pfN" value="${esc(p.full_name||'')}"></div>
    <div><label>Phone</label><input id="pfP" value="${esc(p.phone||'')}"></div>
    <div><label>Employee code</label><input value="${esc(p.employee_code||'')}" disabled></div>
    <div><label>Designation</label><input value="${esc(p.designation||'')}" disabled></div>
    <div><label>Department</label><input value="${esc(p.department||'')}" disabled></div></div>
    <button class="primary" id="pfSave">Save</button></div>
  <div class="card"><h2>Change password</h2><div class="grid"><div><label>New password</label><input id="pw1" type="password"></div><div><label>Repeat</label><input id="pw2" type="password"></div></div><button class="ghost" id="pwGo">Change password</button></div>
  <div class="card"><h2>My access</h2><p><b>Roles:</b> ${me.roles.map(r=>chip(r,'ok')).join(' ') || chip('No role','bad')}</p>
    <p><b>Locations:</b> ${me.office ? chip('All locations','info') : me.locations.map(l=>chip(l.code)).join(' ') || chip('None','bad')}</p>
    <p><b>I can:</b></p><ul>${perms.filter(x=>me.grants.includes(x.key)).map(x=>`<li>${esc(x.module)} · ${esc(x.description)}</li>`).join('') || '<li class="muted">Nothing yet — ask the administrator for a role.</li>'}</ul></div>`;
  $('pfSave').onclick = e => act(e.target, async () => { await rpc('sys_profile_update', {p_full_name:$('pfN').value, p_phone:$('pfP').value}); }, 'Profile saved');
  $('pwGo').onclick = e => act(e.target, async () => { if($('pw1').value.length<6) throw new Error('At least 6 characters'); if($('pw1').value!==$('pw2').value) throw new Error('The two passwords differ'); const {error} = await sb.auth.updateUser({password:$('pw1').value}); if(error) throw new Error(error.message); $('pw1').value=$('pw2').value=''; }, 'Password changed');
};

/* ============ USERS & ROLES (access administration) ============ */
VIEWS.access = async m => {
  S.acc = S.acc || (can('sys_user_admin') ? 'users' : 'roles');
  const [users, roles, perms, rp, ur, sc, locs] = await Promise.all([
    can('sys_user_admin') ? q('sys_users', b => b.order('email')) : [], q('sys_roles', b => b.order('name')), q('sys_permissions', b => b.order('module').order('sort')),
    q('sys_role_permissions'), can('sys_user_admin') ? q('sys_user_roles') : [], can('sys_user_admin') ? q('sys_user_scopes') : [], q('wh_locations', b => b.order('code'))]);
  const modules = [...new Set(perms.map(p => p.module))];
  const sub = [['users','Users'],['roles','Roles'],['perms','Permission catalogue']].filter(([k]) => k!=='users' || can('sys_user_admin'));
  m.innerHTML = `<h1>Users & roles</h1><div class="row" style="margin-bottom:12px">${sub.map(([k,l]) => `<button class="${S.acc===k?'primary':'ghost'} sm" data-sub="${k}">${l}</button>`).join('')}</div><div id="accBody"></div>`;
  m.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.acc = b.dataset.sub; go(); });
  const body = $('accBody');
  const roleNames = uid => ur.filter(x=>x.user_id===uid).map(x=>(roles.find(r=>r.id===x.role_id)||{}).name).filter(Boolean);
  const scopeTxt = uid => sc.some(x=>x.user_id===uid && x.scope_type==='all_locations') ? chip('All locations','info') : sc.filter(x=>x.user_id===uid && x.scope_type==='location').map(x=>chip((locs.find(l=>l.id===x.scope_id)||{}).code||'?')).join(' ') || chip('None','bad');
  const permGrid = (checked, disabled) => modules.map(md => `<div style="margin-bottom:10px"><div class="muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-bottom:4px">${esc(md)}</div>
     ${perms.filter(p=>p.module===md).map(p => `<label class="row" style="margin:0 0 4px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600"><input type="checkbox" data-perm="${p.key}" ${checked.includes(p.key)?'checked':''} ${disabled?'disabled':''}> ${esc(p.description)} <span class="muted">(${esc(p.action||'')})</span></label>`).join('')}</div>`).join('');

  const userForm = (u) => {
    const isNew = !u; u = u || {};
    const myRoles = ur.filter(x=>x.user_id===u.id).map(x=>x.role_id);
    const all = sc.some(x=>x.user_id===u.id && x.scope_type==='all_locations');
    const myLocs = sc.filter(x=>x.user_id===u.id && x.scope_type==='location').map(x=>x.scope_id);
    modal(`<h2>${isNew ? 'Add user' : esc(u.email)}</h2>
      <div class="grid">
        ${isNew ? `<div><label>Email (login)</label><input id="uE" type="email" placeholder="name@gmail.com"></div><div><label>Temporary password</label><input id="uP" value="${Math.random().toString(36).slice(2,8)}${Math.floor(Math.random()*90+10)}"></div>` : ''}
        <div><label>Full name</label><input id="uN" value="${esc(u.full_name||'')}"></div><div><label>Phone</label><input id="uPh" value="${esc(u.phone||'')}"></div>
        <div><label>Employee code</label><input id="uC" value="${esc(u.employee_code||'')}"></div><div><label>Designation</label><input id="uD" value="${esc(u.designation||'')}"></div>
        <div><label>Department</label><input id="uDp" value="${esc(u.department||'')}"></div>
        ${isNew ? '' : `<div><label>Status</label><select id="uA"><option value="true" ${u.is_active?'selected':''}>Active</option><option value="false" ${!u.is_active?'selected':''}>Inactive (no access)</option></select></div>`}
      </div>
      <h2 style="margin-top:10px">Roles</h2><div class="row">${roles.filter(r=>r.is_active).map(r => `<label class="row" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600" title="${esc(r.description||'')}"><input type="checkbox" data-role="${r.id}" ${myRoles.includes(r.id)?'checked':''}> ${esc(r.name)}</label>`).join('')}</div>
      <h2 style="margin-top:14px">Locations</h2><label class="row" style="margin:0 0 6px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:700"><input type="checkbox" id="uAll" ${all?'checked':''}> All locations (office / head office)</label>
      <div class="row" id="uLocs">${locs.map(l => `<label class="row" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" data-loc="${l.id}" ${myLocs.includes(l.id)?'checked':''}> ${esc(l.code)}</label>`).join('') || '<span class="muted">No locations yet — add them in Masters.</span>'}</div>
      <div class="row" style="margin-top:16px"><button class="primary" id="uGo">${isNew?'Add user':'Save'}</button>${isNew?'':'<button class="ghost" id="uPw">Set new password</button>'}<button class="ghost" onclick="closeModal()">Cancel</button></div>
      ${isNew?'<p class="muted">Share the email and temporary password with the user; they can change it in My profile. If they later sign in with Google using the same email, it opens this same account.</p>':''}`);
    const upd = () => $('uLocs').style.opacity = $('uAll').checked ? .4 : 1; $('uAll').onchange = upd; upd();
    $('uGo').onclick = e => act(e.target, async () => {
      const p = {full_name:$('uN').value, phone:$('uPh').value, employee_code:$('uC').value, designation:$('uD').value, department:$('uDp').value,
        role_ids:[...document.querySelectorAll('[data-role]:checked')].map(x=>x.dataset.role), all_locations:$('uAll').checked,
        location_ids:$('uAll').checked ? [] : [...document.querySelectorAll('[data-loc]:checked')].map(x=>x.dataset.loc)};
      if(isNew){ p.email = $('uE').value; p.password = $('uP').value; await rpc('sys_user_create', {p}); toast(`User added. Login: ${p.email} / ${p.password}`, 'ok', 12000); }
      else { p.id = u.id; p.is_active = $('uA').value==='true'; await rpc('sys_user_save', {p}); toast('Saved'); }
      closeModal(); if(p.id===S.me.user_id){ S.me = await rpc('wh_me'); } go();
    });
    if(!isNew) $('uPw').onclick = () => { const pw = prompt('New password for ' + u.email + ' (min 6 characters)'); if(pw) act(null, async () => { await rpc('sys_user_set_password', {p_user:u.id, p_password:pw}); }, 'Password set — share it with the user'); };
  };

  if(S.acc==='users'){
    body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="muted" style="margin:0">A login alone gives no access. Access = the user's roles, limited to their locations.</p><button class="primary" id="uNew">+ Add user</button></div>
    <div class="card">${table([{h:'User',f:u=>`<b>${esc(u.full_name||'')}</b><br><span class="muted">${esc(u.email)}</span>`},{h:'Phone',k:'phone'},{h:'Designation',f:u=>esc([u.designation,u.department].filter(Boolean).join(' · '))},
      {h:'Roles',f:u=>roleNames(u.id).map(n=>chip(n,'ok')).join(' ')||chip('No role','bad')},{h:'Locations',f:u=>scopeTxt(u.id)},{h:'Status',f:u=>u.is_active?chip('active','ok'):chip('inactive','bad')},{h:'',f:u=>`<button class="ghost sm" data-ed="${u.id}">Edit</button>`}], users)}</div>`;
    $('uNew').onclick = () => userForm(null);
    body.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => userForm(users.find(u=>u.id===b.dataset.ed)));
  }
  if(S.acc==='roles'){
    body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="muted" style="margin:0">A role is a set of permissions. Give users roles; change a role once and every user holding it changes.</p>${can('sys_role_admin')?'<button class="primary" id="rNew">+ New role</button>':''}</div>
    <div class="card">${table([{h:'Role',f:r=>`<b>${esc(r.name)}</b><br><span class="muted">${esc(r.code)}</span>`},{h:'Description',k:'description'},{h:'Permissions',n:1,f:r=>r.code==='ADMIN'?'all':rp.filter(x=>x.role_id===r.id).length},
      {h:'Users',n:1,f:r=>can('sys_user_admin')?ur.filter(x=>x.role_id===r.id).length:''},{h:'Status',f:r=>r.is_active?chip('active','ok'):chip('inactive','bad')},{h:'',f:r=>`<button class="ghost sm" data-re="${r.id}">${can('sys_role_admin')&&!r.is_system?'Edit':'View'}</button>`}], roles)}</div>`;
    const roleForm = r => {
      const isNew = !r; r = r || {}; const ro = !can('sys_role_admin') || r.is_system;
      modal(`<h2>${isNew?'New role':esc(r.name)}</h2>${r.is_system?'<p class="muted">The Administrator role always holds every permission, including those added by future modules.</p>':''}
        <div class="grid">${isNew?'<div><label>Code</label><input id="rC" placeholder="e.g. PLANT_EXEC"></div>':''}<div><label>Name</label><input id="rN" value="${esc(r.name||'')}" ${ro?'disabled':''}></div>
        <div style="grid-column:span 2"><label>Description</label><input id="rD" value="${esc(r.description||'')}" ${ro?'disabled':''}></div>
        ${isNew||ro?'':`<div><label>Status</label><select id="rA"><option value="true" ${r.is_active?'selected':''}>Active</option><option value="false" ${!r.is_active?'selected':''}>Inactive</option></select></div>`}</div>
        <h2 style="margin-top:10px">Permissions</h2>${permGrid(r.is_system ? perms.map(p=>p.key) : rp.filter(x=>x.role_id===r.id).map(x=>x.permission_key), ro)}
        <div class="row" style="margin-top:14px">${ro?'':`<button class="primary" id="rGo">${isNew?'Create role':'Save'}</button>`}${!isNew&&!ro?'<button class="danger" id="rDel">Delete</button>':''}<button class="ghost" onclick="closeModal()">Close</button></div>`);
      if(ro) return;
      $('rGo').onclick = e => act(e.target, async () => {
        const p = {name:$('rN').value, description:$('rD').value, permissions:[...document.querySelectorAll('[data-perm]:checked')].map(x=>x.dataset.perm)};
        if(isNew){ p.code = $('rC').value; if(!p.code || !p.name) throw new Error('Code and name are required'); } else { p.id = r.id; p.is_active = $('rA').value==='true'; }
        await rpc('sys_role_save', {p}); closeModal(); S.me = await rpc('wh_me'); go();
      }, 'Role saved');
      if($('rDel')) $('rDel').onclick = e => { if(confirm('Delete role ' + r.name + '?')) act(e.target, async () => { await rpc('sys_role_delete', {p_role:r.id}); closeModal(); go(); }, 'Role deleted'); };
    };
    if($('rNew')) $('rNew').onclick = () => roleForm(null);
    body.querySelectorAll('[data-re]').forEach(b => b.onclick = () => roleForm(roles.find(r=>r.id===b.dataset.re)));
  }
  if(S.acc==='perms'){
    body.innerHTML = `<p class="muted">Every module adds its permissions here as it is built. Roles pick them up in the Roles tab; the Administrator role gets them automatically.</p>
    <div class="card">${table([{h:'Module',k:'module'},{h:'Permission',k:'description'},{h:'Action',k:'action'},{h:'Code',f:p=>`<span class="muted">${esc(p.key)}</span>`},{h:'In roles',f:p=>roles.filter(r=>r.code==='ADMIN'||rp.some(x=>x.role_id===r.id&&x.permission_key===p.key)).map(r=>chip(r.name)).join(' ')}], perms)}</div>`;
  }
};
</script>
</body>
