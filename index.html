<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#236B76" />
<title>SS Logistics</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    /* SS Logistics brand: mint, aqua and deep teal from the logo */
    --ink:#123A40; --deep:#236B76; --moss:#2F7D87; --lime:#3BB3C8; --mint:#B6DDC8; --aqua:#3BB3C8;
    --sand:#E7F4F2; --paper:#F3F9F8; --line:#D6E8E6; --slate:#5F7E82;
    --alert:#C0473B; --amber:#C98A2E; --ok:#1F8A6A; --r:14px; --tap:48px;
    --grad:linear-gradient(135deg,#2F7D87 0%,#3BB3C8 100%);
    --shadow:0 1px 2px rgba(18,58,64,.06),0 4px 16px rgba(18,58,64,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.4}
  .topbar{position:sticky;top:0;z-index:20;background:var(--deep);color:var(--sand);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:.16em;font-size:14px;text-transform:uppercase;white-space:nowrap}
  .brand b{color:var(--lime)}
  .topbar select{width:auto;height:36px;font-size:14px;background:#fff;min-width:180px;max-width:100%}
  .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right;line-height:1.2}
  .who a{color:var(--lime);cursor:pointer}
  .tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:56px;z-index:15}
  .tabs button{width:auto;height:44px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;font-size:14px;font-weight:700;color:var(--slate);padding:0 12px;white-space:nowrap}
  .tabs button.on{color:var(--deep);border-bottom-color:var(--lime)}
  .tabs .sep{width:1px;background:var(--line);margin:10px 6px}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
  h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:4px 0 12px;font-weight:800}
  h2{font-size:15px;margin:0 0 10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin:0 0 5px;font-weight:700}
  input,select,textarea{width:100%;height:var(--tap);font-size:15px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit}
  textarea{height:auto;min-height:120px;padding:10px 12px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss);background:#fff}
  input[type=checkbox]{width:20px;height:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  table.rgrid td input{width:100%}
  .field{margin-bottom:12px}
  button{height:var(--tap);border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;padding:0 16px;font-family:inherit}
  .primary{background:var(--deep);color:#fff} .primary:disabled{background:#A9B4AE}
  .lime{background:var(--lime);color:var(--ink)}
  .ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line)}
  .danger{background:var(--alert);color:#fff}
  .sm{height:34px;font-size:13px;padding:0 10px;border-radius:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row>*{flex:0 0 auto}
  .grow{flex:1 1 auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);border-bottom:2px solid var(--line);padding:8px 6px;white-space:nowrap}
  td{border-bottom:1px solid #eee7d8;padding:8px 6px;vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .tbl{overflow-x:auto}
  .chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sand);color:var(--ink);white-space:nowrap}
  .chip.ok{background:#DCEFD9;color:var(--ok)} .chip.warn{background:#F6E6CC;color:#8a5a14} .chip.bad{background:#F4D7D3;color:var(--alert)} .chip.info{background:#DDE9F3;color:#20507a}
  .plate{font-family:Consolas,monospace;font-weight:800;white-space:nowrap;display:inline-block;background:var(--lime);color:var(--ink);padding:3px 8px;border-radius:6px;letter-spacing:.04em}
  .muted{color:var(--slate);font-size:13px}
  .issues{background:#FBEDEA;border:1px solid #EFC2BB;color:var(--alert);border-radius:10px;padding:10px 14px;margin:10px 0}
  .okbox{background:#E8F4E4;border:1px solid #C3DFBA;color:var(--ok);border-radius:10px;padding:10px 14px;margin:10px 0}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
  .toast{z-index:200!important;position:fixed;left:16px;right:16px;bottom:20px;max-width:560px;margin:0 auto;z-index:60;padding:12px 16px;border-radius:12px;color:#fff;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateY(160%);transition:transform .3s}
  .toast{visibility:hidden} .toast.show{transform:translateY(0);visibility:visible} .toast.ok{background:var(--ok)} .toast.err{background:var(--alert)} .toast.warn{background:var(--amber)}
  .modal{position:fixed;inset:0;background:rgba(11,31,23,.5);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
  .modal .box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:18px}
  .hide{display:none!important}
  .center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;margin:0 auto}
  .logo{font-weight:800;letter-spacing:.2em;font-size:26px;text-transform:uppercase;text-align:center;margin-bottom:6px}
  .logo b{color:var(--moss)}
  .tag{text-align:center;color:var(--slate);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:30px}
  .empty{text-align:center;color:var(--slate);padding:22px 10px;font-size:14px}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:s .7s linear infinite;vertical-align:-4px}
  @keyframes s{to{transform:rotate(360deg)}}
  pre.msg{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;max-height:260px;overflow:auto}
  /* ===== home: one block per module ===== */
  body.home .side, body.home .menuBtn, body.home #locSel{display:none!important}
  .home-wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
  .home-hello{font-size:22px;font-weight:800;margin:0 0 4px}
  .mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:22px}
  .mod{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;height:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer;color:var(--ink);font-family:inherit;transition:transform .12s, box-shadow .12s, border-color .12s}
  .mod:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(11,61,46,.12);border-color:var(--moss)}
  .mod .ic{width:48px;height:48px;border-radius:12px;background:#EEF5E6;color:var(--deep);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .mod .nm{font-size:18px;font-weight:800;margin-bottom:6px}
  .mod .ds{font-size:13.5px;color:var(--slate);font-weight:500;line-height:1.45}
  .side .back{color:var(--moss);font-weight:800}
  @media (min-width:1024px){ .homeLinks{display:none} }
  @media (max-width:640px){ .mods{grid-template-columns:1fr 1fr;gap:12px} .mod{padding:16px 14px} .mod .nm{font-size:16px} .mod .ds{display:none} .home-wrap{padding:18px 14px 60px} }
  /* ===== responsive shell: sidebar on desktop, drawer on tablet & phone ===== */
  input,select,textarea{font-size:16px}
  .topbar{position:sticky;top:0;z-index:30;flex-wrap:nowrap;min-height:56px}
  .menuBtn{display:none;background:none;color:var(--sand);font-size:24px;height:44px;width:44px;padding:0;flex:0 0 auto}
  .shell{display:flex;align-items:flex-start}
  .side{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);padding:8px 0 24px}
  .sideHead{display:none}
  .side .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:800;padding:14px 18px 6px}
  .side button{display:block;width:100%;text-align:left;height:42px;background:none;border:0;border-left:4px solid transparent;border-radius:0;font-size:14.5px;font-weight:700;color:var(--ink);padding:0 14px}
  .side button:hover{background:var(--paper)}
  .side button.on{border-left-color:var(--lime);background:#EEF5E6;color:var(--deep)}
  .scrim{display:none}
  .wrap{flex:1 1 auto;min-width:0;max-width:1180px}
  .modal .box{max-height:calc(100vh - 60px);overflow:auto}
  @media (max-width:1023px){
    .menuBtn{display:block}
    .side{position:fixed;top:0;left:0;bottom:0;height:100vh;z-index:50;width:280px;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
    body.nav-open .side{transform:none}
    body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(11,31,23,.45);z-index:45}
    .sideHead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--deep);color:var(--sand);font-size:13px}
    .sideHead a{color:var(--lime);cursor:pointer}
    .who{display:none}
    .topbar select{flex:1 1 auto;min-width:0}
  }
  @media (max-width:640px){
    .brand{display:none}
    .wrap{padding:12px 12px 80px}
    .grid{grid-template-columns:1fr}
    .kpi{grid-template-columns:1fr 1fr}
    .kpi b{font-size:18px}
    .card{padding:12px}
    .row>button,.row>a{flex:1 1 auto}
    .modal{padding:0}
    .modal .box{max-width:none;min-height:100vh;border-radius:0;max-height:none}
    /* tables become cards: one row = one card, each cell labelled */
    .tbl table,.tbl thead,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
    .tbl thead{display:none}
    .tbl tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
    .tbl td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
    .tbl td::before{content:attr(data-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);font-weight:700;text-align:left;flex:0 0 auto;padding-top:2px}
    .tbl td[data-label=""]::before{display:none}
    .tbl td[data-label=""]{justify-content:flex-end;flex-wrap:wrap}
    .tbl td input,.tbl td select{max-width:60%}
  }
  @media (min-width:641px) and (max-width:1023px){ .wrap{padding:14px 18px 80px} }
  /* ===== SS Logistics theme ===== */
  body{background:var(--paper);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  .topbar{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 6px 20px rgba(18,58,64,.05)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);letter-spacing:0;text-transform:none;font-size:16px;font-weight:800}
  .brand img{width:34px;height:34px;object-fit:contain}
  .brand .bname{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  #modName{color:var(--slate);font-weight:600}
  #modName:not(:empty)::before{content:"·";margin:0 6px 0 2px;color:var(--line)}
  .menuBtn{color:var(--deep)}
  .topbar select{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600;border-radius:10px}
  .who{color:var(--slate);opacity:1}
  .who a,.who #uRole{color:var(--deep)!important;font-weight:600}
  .side{background:#fff;border-right:1px solid var(--line)}
  .side button{color:var(--ink);font-weight:600;border-radius:0 10px 10px 0;margin-right:10px;width:calc(100% - 10px);transition:background .15s,color .15s}
  .side button:hover{background:var(--sand)}
  .side button.on{border-left-color:var(--aqua);background:linear-gradient(90deg,#DDF1F3,#EEF8F6);color:var(--deep);font-weight:800}
  .side .grp{color:var(--moss)}
  .sideHead{background:var(--grad)!important;color:#fff!important}
  .sideHead a{color:#fff!important;text-decoration:underline}
  h1{color:var(--moss);letter-spacing:.1em}
  .card{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
  input,select,textarea{background:#fff;border-color:var(--line);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 4px rgba(59,179,200,.15)}
  input:disabled{background:var(--paper);color:var(--slate)}
  button{transition:transform .08s,box-shadow .15s,filter .15s}
  button:active{transform:scale(.98)}
  .primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(47,125,135,.25)}
  .primary:hover{filter:brightness(1.05);box-shadow:0 6px 18px rgba(47,125,135,.32)}
  .primary:disabled{background:#B7CDCF;box-shadow:none}
  .lime{background:var(--mint);color:var(--ink)}
  .lime:hover{filter:brightness(.97)}
  .ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line)}
  .ghost:hover{border-color:var(--aqua);background:#F7FCFC}
  .plate{background:#FFF6D6;color:#3A2E00;border:1.5px solid #E5CF7A}
  th{color:var(--moss);border-bottom-color:var(--line)}
  td{border-bottom-color:#E9F2F1}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#F6FBFB}
  .chip{background:var(--sand);color:var(--deep)}
  .chip.ok{background:#DDF3EA;color:var(--ok)} .chip.info{background:#DDF1F5;color:#1D6C7D}
  .kpi div{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;background:#fff}
  .kpi span{color:var(--moss)}
  .okbox{background:#E6F5EF;border-color:#BFE3D2;color:var(--ok)}
  .toast.ok{background:var(--deep)}
  .modal{background:rgba(18,58,64,.45);backdrop-filter:blur(3px)}
  .modal .box{box-shadow:0 20px 60px rgba(18,58,64,.25);border-radius:18px}
  a{color:var(--moss)}
  /* login */
  #login{background:radial-gradient(1200px 600px at 50% -10%, #DDF1F3 0%, transparent 60%), radial-gradient(800px 400px at 110% 110%, #E3F3EA 0%, transparent 60%), var(--paper);min-height:100vh;max-width:none}
  #login>*{max-width:380px;width:100%;margin-left:auto;margin-right:auto}
  .loginLogo{display:block;width:170px!important;margin:0 auto 6px!important}
  .tag{color:var(--moss)}
  /* home */
  html{background:var(--paper)}
  body.home{min-height:100vh;background:radial-gradient(900px 420px at 15% -5%, #DDF1F3 0%, transparent 60%), radial-gradient(700px 360px at 100% 0%, #E3F3EA 0%, transparent 55%), var(--paper);background-attachment:fixed}
  .home-hello{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
  .mod{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;position:relative;overflow:hidden}
  .mod::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);opacity:.9}
  .mod:hover{border-color:var(--aqua);box-shadow:0 14px 34px rgba(47,125,135,.18)}
  .mod .ic{background:linear-gradient(135deg,#E3F3EA,#DDF1F5);color:var(--deep)}
  .mod .nm{color:var(--ink)}
  @media (max-width:640px){ body:not(.home) .bname, body:not(.home) #modName{display:none} .brand img{width:30px;height:30px} }
  /* rake operations */
  .rkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:16px}
  .rkc{display:block;text-align:left;height:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink);font-weight:500;cursor:pointer;position:relative;overflow:hidden}
  .rkc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
  .rkc:hover{border-color:var(--aqua);box-shadow:0 10px 26px rgba(47,125,135,.16)}
  .rkc b{font-size:15px}
  .rkm{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 6px;font-size:12.5px;color:var(--slate)}
  .rkm b{color:var(--ink);font-size:14px}
  .clk{margin-top:8px}
  .clkT{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);margin-bottom:4px}
  .clkB{height:8px;border-radius:99px;background:#E9F2F1;overflow:hidden}
  .clkB i{display:block;height:100%;border-radius:99px;transition:width .3s}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .rtabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;border-bottom:2px solid var(--line);-webkit-overflow-scrolling:touch}
  .rtabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--slate);border-radius:0;box-shadow:none;min-height:0}
  .rtabs button.on{color:var(--deep);border-bottom-color:var(--deep)}
  .rtb{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--deep);color:#fff;font-size:11px;line-height:18px;text-align:center}
  .steps span{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--slate)}
  .steps span.done{background:#DDF3EA;border-color:#BFE3D2;color:var(--ok)}
  .steps span.cur{background:var(--grad);border-color:transparent;color:#fff}
  .checks div{padding:4px 0;font-size:14px}
  .warnbox{background:#FFF4E0;border:1px solid #F1D9A6;color:#8a5a14;border-radius:10px;padding:10px 14px;margin:10px 0}
  .lineRow{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;align-items:center;margin-bottom:6px}
  @media (max-width:640px){ .lineRow{grid-template-columns:1fr 100px 40px} .rkgrid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* compact module tiles: icon + name + one short line */
  .home-wrap{max-width:1180px;padding:18px 20px 40px}
  .mods{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
  .mod{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;min-height:0}
  .mod::after{height:3px}
  .mod .ic{width:38px;height:38px;border-radius:10px;margin:0;flex:0 0 38px}
  .mod .ic svg{width:20px;height:20px}
  .mod .tx{min-width:0;flex:1}
  .mod .nm{font-size:15px;margin:0 0 2px;line-height:1.25}
  .mod .ds{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @media (max-width:640px){ .mods{grid-template-columns:1fr;gap:8px} .mod{padding:10px 12px} .mod .ds{display:-webkit-box;-webkit-line-clamp:1} .home-hello{font-size:20px} }

</style>
</head>
<body>

<div id="login" class="center">

function niceErr(m){
  m = String(m || 'Something went wrong');

  if(d){ const f = d[1].replace(/^.*_(code|name|gstin|pan|registration_no|vendor_code|sap_code|email)$/, '$1').replace(/_/g,' ');

  if(/violates foreign key/i.test(m)) return 'This record is linked to other records, so it cannot be changed or removed this way.';

  return m;
}

function geo(){ return new Promise(res => { if(!navigator.geolocation) return res({}); navigator.geolocation.getCurrentPosition(p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}), () => res({}), {timeout:6000, maximumAge:60000}); }); }
async function stampImage(file, lines){
  const img = await createImageBitmap(file); const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width*scale; c.height = img.height*scale;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  const fs = Math.max(16, Math.round(c.width/45)); x.font = `bold ${fs}px sans-serif`;
  const h = (fs+8)*lines.length + 10; x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, c.height-h, c.width, h);
  x.fillStyle = '#fff'; lines.forEach((l,i) => x.fillText(l, 12, c.height - h + (fs+8)*(i+1)));
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}
function capture(entityType, entityId, label, allowVideo=false){
  return new Promise((resolve, reject) => {
    const inp = $('camInput'); inp.value=''; inp.accept = allowVideo ? 'image/*,video/*' : 'image/*';
    inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return reject(new Error('No photo taken'));
      try{
        const g = await geo(); const now = new Date(); const isVideo = f.type.startsWith('video');
        const stamp = [label, now.toLocaleString('en-IN'), g.lat ? `GPS ${g.lat}, ${g.lng}` : 'GPS not available'];
        const body = isVideo ? f : await stampImage(f, stamp);
        const path = `${entityType}/${entityId}/${now.getTime()}.${isVideo ? (f.name.split('.').pop()||'mp4') : 'jpg'}`;
        const up = await sb.storage.from('wh-evidence').upload(path, body, {contentType: isVideo ? f.type : 'image/jpeg'});
        if(up.error) throw new Error(up.error.message);
        const {error} = await sb.from('wh_evidence').insert({entity_type:entityType, entity_id:entityId, kind:isVideo?'video':'photo', storage_path:path, taken_at:now.toISOString(), lat:g.lat||null, lng:g.lng||null, uploaded_by:S.me.user_id});
        if(error) throw new Error(error.message);
        toast((isVideo?'Video':'Photo') + ' saved'); resolve(path);
      }catch(e){ toast(e.message,'err',6000); reject(e); }
    };
    inp.click();
  });
}

/* ============ RR / WAGON SHEET READERS (used by Rake Operations) ============ */
async function parseRR(file){
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let t=''; for(let i=1;i<=doc.numPages;i++){ const p = await doc.getPage(i); t += (await p.getTextContent()).items.map(x=>x.str).join(' ') + '\n'; }
  const g = re => { const m = t.match(re); return m ? m[1] : null; };
  const iso = s => s ? s.split('-').reverse().join('-') : null;
  return { rr_no:g(/RR No:\s*(\d+)/), rr_date:iso(g(/RR Date:\s*([\d-]+)/)), fnr:g(/FNR:\s*(\d+)/), from_station:g(/Station From:\s*([A-Z]+)/),
           to_station:g(/Station To:\s*([A-Z]+)/), railway_invoice_no:g(/TAX Invoice Number:\s*(\d+)/), invoice_date:iso(g(/Invoice Date:\s*([\d-]+)/)),
           rr_wagon_count:+g(/Wagons:\s*(\d+)/)||null, rr_mt:+g(/Total Weight:\s*([\d.]+)/)||null, rr_bags:+g(/Total:\s*(\d+)/)||null };
}
async function parseWagonSheet(file){
  const wb = XLSX.read(await file.arrayBuffer()); const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  const hi = rows.findIndex(r => r.some(c => typeof c==='string' && /wagon\s*no/i.test(c)));
  if(hi<0) throw new Error('Could not find the "Wagon No." header row in the wagon sheet');
  const h = rows[hi].map(c => (c==null?'':String(c)).trim().toLowerCase()); const col = re => h.findIndex(x => re.test(x));
  const c = {sr:col(/^sr/), wagon:col(/wagon\s*no/), type:col(/wagon\s*type/), bags:col(/bags/), mt:col(/^mt$|tonn|weight/), brand:col(/brand|material|grade/), dest:col(/destination/)};
  const out = [];
  for(const r of rows.slice(hi+1)){
    const wn = r[c.wagon]; if(!wn || !/[A-Z]{2,4}\d{8,}/i.test(String(wn))) continue;
    out.push({sr:+r[c.sr]||out.length+1, wagon_no:String(wn).trim().toUpperCase(), wagon_type:c.type>=0?r[c.type]:null, bags:+r[c.bags], mt:+r[c.mt], material:c.brand>=0?String(r[c.brand]).trim():'', destination:c.dest>=0?r[c.dest]:null});
  }
  return out;
}

async function icItemsOf(x){
  let b = sb.from('ic_items').select('*').eq('period', x.period).eq('status', 'approved').order('doc_date').order('doc_no');
  const {data, error} = await b; if(error) throw new Error(error.message);
  return (data||[]).filter(r => [r.debtor_id, r.creditor_id].sort().join() === [x.company_lo, x.company_hi].sort().join());
}
async function icStatement(x){
  const rows = await icItemsOf(x); const lo = x.company_lo, hi = x.company_hi;
  const sec = (t, f) => { const list = rows.filter(f); if(!list.length) return ''; const a = list.filter(r=>r.debtor_id===lo).reduce((s,r)=>s+ +r.amount,0), b = list.filter(r=>r.debtor_id===hi).reduce((s,r)=>s+ +r.amount,0);
    return `<h3>${t}</h3><table><tr><th>Date</th><th>Doc</th><th>Details</th><th class="n">${esc(x.lo_code)} owes ${esc(x.hi_code)}</th><th class="n">${esc(x.hi_code)} owes ${esc(x.lo_code)}</th></tr>${list.map(r => `<tr><td>${d8(r.doc_date)}${r.is_prior_period?' *':''}</td><td>${esc(r.doc_no)}</td><td>${esc(r.narration)}</td><td class="n">${r.debtor_id===lo ? inr(r.amount) : ''}</td><td class="n">${r.debtor_id===hi ? inr(r.amount) : ''}</td></tr>`).join('')}
      <tr><th colspan="3">Total</th><th class="n">${inr(a)}</th><th class="n">${inr(b)}</th></tr></table>`; };
  printWin(`<h2>Inter-company statement · ${monthLbl(x.period)}</h2><div>${esc(coName(lo))} (${esc(x.lo_code)}) ↔ ${esc(coName(hi))} (${esc(x.hi_code)})</div>
    <div>${x.settle_no ? `Settlement ${esc(x.settle_no)} · approved ${dt(x.approved_at)}` : '<b>PROPOSAL, not yet approved</b>'}</div>
    ${sec('Truck hire (100% of customer-billed freight)', r => r.item_type==='truck_hire')}${sec('Service billing (100% of customer-billed amount)', r => r.item_type==='service')}${sec('Cash paid / paid on behalf', r => r.item_type==='cash')}
    <table style="margin-top:18px"><tr><th>${esc(x.lo_code)} owes ${esc(x.hi_code)}</th><td class="n">${inr(x.lo_owes)}</td></tr><tr><th>${esc(x.hi_code)} owes ${esc(x.lo_code)}</th><td class="n">${inr(x.hi_owes)}</td></tr>
    <tr><th>Net payment</th><td class="n"><b>${x.payer_company_id ? `${esc(coCode(x.payer_company_id))} pays ${esc(coCode(x.payee_company_id))} ${inr(x.net_amount)}` : 'Nil'}</b></td></tr><tr><th>Due by</th><td class="n">${d8(x.due_date)}</td></tr>
    ${x.paid_on ? `<tr><th>Paid</th><td class="n">${d8(x.paid_on)} · ${esc(x.paid_ref||'')}</td></tr>` : ''}${x.busy_voucher_no ? `<tr><th>BUSY voucher</th><td class="n">${esc(x.busy_voucher_no)}</td></tr>` : ''}</table>
    ${rows.some(r=>r.is_prior_period) ? '<p>* Prior-period adjustment: dated in an earlier, already-approved month.</p>' : ''}<p style="font-size:12px;color:#555">GST treatment is not applied in this statement; follow the CA's advice when posting in BUSY.</p>`);
}
async function icBusyFile(x){
  const rows = await icItemsOf(x); const wb = XLSX.utils.book_new();
  const acc = {diesel:'Diesel Expenses', advance:'Driver Advance', labour:'Labour Charges', rent:'Rent', fund_transfer:''};
  [x.company_lo, x.company_hi].forEach(me => {
    const other = me===x.company_lo ? x.company_hi : x.company_lo, party = coName(other); const out = [];
    const add = (r, vtype, dr, cr, ledger) => out.push({Date:r.doc_date, 'Voucher type':vtype, 'Ref no.':r.doc_no, 'Party ledger':party, 'Party Dr':dr||'', 'Party Cr':cr||'', 'Other ledger':ledger, Narration:r.narration});
    rows.forEach(r => {
      const amt = +r.amount;
      if(r.item_type==='truck_hire') r.creditor_id===me ? add(r, 'Sales', amt, 0, 'Freight Income (inter-company hire)') : add(r, 'Purchase', 0, amt, 'Lorry Hire / Freight Expense');
      else if(r.item_type==='service') r.creditor_id===me ? add(r, 'Sales', amt, 0, 'Service Income (inter-company)') : add(r, 'Purchase', 0, amt, 'Service Charges (inter-company)');
      else { const bank = /Bank /.test(r.narration) ? 'Bank' : 'Cash';
        if(r.creditor_id===me) add(r, 'Payment', amt, 0, bank);
        else r.detail==='fund_transfer' ? add(r, 'Receipt', 0, amt, bank) : add(r, 'Journal', 0, amt, acc[r.detail] || 'Expenses'); }
    });
    if(x.paid_on && x.net_amount > 0){ const r = {doc_date:x.paid_on, doc_no:x.settle_no, narration:`Inter-company settlement ${monthLbl(x.period)} · ${x.paid_ref||''}`};
      if(x.payer_company_id===me) add(r, 'Payment', +x.net_amount, 0, x.paid_mode==='cash' ? 'Cash' : 'Bank'); else add(r, 'Receipt', 0, +x.net_amount, x.paid_mode==='cash' ? 'Cash' : 'Bank'); }
    out.push({}); out.push({Date:'Note', 'Voucher type':'GST not applied. Post as per CA advice.'});
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(out), coCode(me) + ' books');
  });
  XLSX.writeFile(wb, `BUSY_${x.settle_no || ('IC-' + x.period.slice(0,7))}.xlsx`);
}

// Order (MP approves) → placed with dealer → each invoice = one truck → onboarding steps (vendor + cost → voucher; document upload)
// → loan + EMI schedule (NACH: an EMI counts as paid on its due date unless recorded as bounced) → Fleet Head marks Ready → fleet master.
const FT_STEPS = [
  ['body',      'Body building',          'Contract / work order no. (optional)', false],
  ['insurance', 'Insurance',              'Policy number', true],
  ['temp_reg',  'Temporary registration', 'Temporary registration no.', false],
  ['perm_reg',  'Permanent registration', 'Registration no. (e.g. WB23A1234)', false],
  ['permit',    'State permit',           'State permit number', true],
  ['nat_permit','National Permit',        'National Permit authorisation no.', true],
  ['fitness',   'Fitness',                'Fitness certificate no.', true],
  ['road_tax',  'Road tax',               'Tax receipt no.', true],
  ['gps',       'GPS',                    'GPS device ID', false],
  ['fastag',    'FASTag',                 'FASTag ID', false]];
const FT_STEP = Object.fromEntries(FT_STEPS.map(s => [s[0], {n:s[1], doc:s[2], exp:s[3]}]));
const FT_EXTRA = {gps:[['provider','GPS provider']], fastag:[['installed_by','Installed by (bank / agent)']], body:[['body_type','Body type (e.g. 24 ft high-side)']]};
const FT_ORDER_ST = {pending_approval:['waiting for MP approval','warn'], approved:['approved','info'], rejected:['rejected','bad'], placed:['approved · awaiting truck invoices','ok'], cancelled:['cancelled','']};
const FT_EMI_ST = {due:['due','info'], paid:['paid (NACH)','ok'], bounced:['BOUNCED','bad'], repaid:['bounced · repaid','warn']};
const ftModel = id => { const x = (S.ftModels||[]).find(m => m.id===id); return x ? `${x.make} ${x.model}` : ''; };
const ftVendor = id => (S.vendors.find(v => v.id===id)||{}).vendor_name || '';
const ftVT = k => ({body:'body', insurance:'insurance', gps:'gps', fastag:'fastag', dealer:'dealer'})[k] || 'rto';
const vendOpts = (sel, kind) => vOpts(ftVT(kind), sel);
const linkBtn = (href, label, cls='ghost') => `<a class="${cls} sm" style="display:inline-flex;align-items:center;text-decoration:none;border-radius:8px" href="${href}">${label}</a>`;
const isoD = v => { if(v==null || v==='') return null; if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  v = String(v).trim(); let m;
  if((m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
  if(/^\d+(\.\d+)?$/.test(v)){ const d = XLSX.SSF.parse_date_code(+v); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const d = new Date(v); return isNaN(d) ? v : isoD(d); };
const addMonths = (iso, k) => { const [y,mo,d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, mo-1+k, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  return `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,'0')}-${String(Math.min(d, last)).padStart(2,'0')}`; };

function ftStepForm(t, s, v, evN, steps){

  const np = pr.status==='done' ? String((pr.details||{}).np_included) : null;   // 'true' | 'false' | null
  const isImp = t.source==='import';
  const noCost = isImp || ['permit','fitness','road_tax'].includes(s.step) || (s.step==='nat_permit' && np!=='false');

  const prRows = s.step!=='perm_reg' ? '' : `
    <div class="field"><label>National Permit fee included in the package? *</label><select id="fsNp"><option value="">Choose</option><option value="true" ${(s.details||{}).np_included===true?'selected':''}>Yes — included, nothing more to pay</option><option value="false" ${(s.details||{}).np_included===false?'selected':''}>No — we pay it to the Government</option></select></div>`;
  const npRows = !npFee ? '' : `
    <div class="field"><label>National Permit fee ₹ *</label><input type="number" min="0" step="0.01" id="fsA" value="${s.amount ?? ''}"></div>
    <div class="field"><label>Fee paid on *</label><input type="date" id="fsPd" max="${today()}" value="${esc((s.details||{}).np_paid_on||'')}"></div>
    <div class="field"><label>Paid by *</label><select id="fsPm"><option value="bank">Bank</option><option value="cash" ${(s.details||{}).np_mode==='cash'?'selected':''}>Cash</option></select></div>
    <div class="field"><label>Challan / UTR no. *</label><input id="fsPr" value="${esc((s.details||{}).np_ref||'')}"></div>`;
  const note = isImp ? 'Existing truck: record the number, dates and a copy if you have it. Renewal costs are handled separately.' : s.step==='nat_permit' ? (np===null ? 'Complete the permanent registration first: it records whether the National Permit fee is included.' : np==='true' ? 'National Permit fee was included in the registration package: no cost here.' : 'The fee is paid to the Government and recorded here (no vendor voucher). It is added to the truck\'s landed cost.')
    : noCost ? 'Cost is included in the permanent registration package: only the document is recorded here.'
    : s.step==='perm_reg' ? 'The package paid to the RTO agent covers the state permit, fitness and road tax (and the National Permit fee if you say so below). The registration number becomes the truck number everywhere once saved.'
    : paid ? `Voucher ${esc(v.voucher_no)} is paid, so vendor and amount are fixed.` : 'Vendor + amount raises a payment voucher for Accounts automatically.';
  modal(`<h2>${esc(D.n)} · ${esc(t.label)}</h2>
    ${s.status==='not_needed' ? `<div class="issues">Marked not needed: ${esc(s.not_needed_reason||'')}. Saving re-opens it.</div>` : ''}
    <div class="grid">${vendorRows}${prRows}${npRows}
    <div class="field"><label>${esc(D.doc)}</label><input id="fsN" value="${esc(s.doc_no||'')}"></div>
    <div class="field"><label>${s.step==='gps' || s.step==='fastag' ? 'Installed on' : 'Issued on'}</label><input type="date" id="fsI" max="${today()}" value="${s.issued_on||''}"></div>
    ${D.exp ? `<div class="field"><label>Valid till (expiry)</label><input type="date" id="fsE" value="${s.expiry_on||''}"></div>` : ''}
    ${ex.map(([k,l]) => `<div class="field"><label>${esc(l)}</label><input data-x="${k}" value="${esc((s.details||{})[k]||'')}"></div>`).join('')}
    <div class="field"><label>${s.step==='body' ? 'Photo of finished body (optional)' : t.source==='import' ? 'Document copy (optional for existing trucks)' : 'Document (photo / PDF, needed to mark done)'}${evN ? ` · ${evN} uploaded` : ''}</label><input type="file" id="fsF" accept="image/*,application/pdf"></div>
  </div><p class="muted">${note}</p>
  <div class="row" style="margin-top:12px"><button class="ghost" id="fsSave">Save (not finished)</button><button class="primary" id="fsDone">Save & mark done</button>
    ${canSkip && s.status!=='not_needed' ? '<button class="ghost" id="fsSkip">Not needed</button>' : ''}<button class="ghost" onclick="closeModal()">Cancel</button></div>`);
  if($('fsV')){ $('fsV')._opts = () => vendOpts(null, s.step); wireAdd($('modalBox')); }
  const payload = done => { const p = {doc_no:$('fsN').value, issued_on:$('fsI').value || null, done};

  if($('fsSkip')) $('fsSkip').onclick = e => { const why = prompt(s.step==='body' ? 'Why is no body work needed? (e.g. factory-built body)' : s.step==='nat_permit' ? 'Why is no National Permit needed? (e.g. truck runs within the state only)' : 'Why is temporary registration not needed?'); if(why===null) return;
    act(e.target, async () => { await rpc('ft_step_save', {p_step:s.id, p:{not_needed:true, reason:why}}); closeModal(); go(); }, 'Marked not needed'); };
}

const FL_DOCS = ['insurance','permit','nat_permit','fitness','road_tax','gps','fastag'];

  const d = Math.floor((new Date(s.expiry_on + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000);
  return d < 0 ? [`expired ${-d} day(s) ago`,'bad'] : d <= 30 ? [`expires in ${d} day(s)`,'warn'] : ['valid','ok']; };

VIEWS.fl_fastag = async m => {
  m.innerHTML = `<h1>FASTag mapping</h1>
  <div class="card"><p style="margin-top:0">Upload the FASTag list from the bank / issuer portal. Each tag is mapped to the existing truck with the same vehicle number. One tag = one truck; a new tag on a truck replaces the old one (the old tag is kept in history).</p>
  <p class="muted">Columns read: vehicle number (vehicle_no / registration_no / VRN), tag ID (tag_id / FASTag ID / Tag Serial No / TID), and optionally issuer / bank, customer ID, status, issue date. Header names are matched flexibly.</p>
  <div class="row"><button class="ghost sm" id="faT">Download template</button><input type="file" id="faF" accept=".xlsx,.xls,.csv" style="max-width:320px"><button class="primary sm" id="faGo">Upload & map</button></div><div id="faOut"></div></div>`;
  $('faT').onclick = () => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{registration_no:'WB23A1234', tag_id:'34161FA82032D6A00001234', issuer:'ICICI BANK', customer_id:'', tag_status:'Active', issued_on:'01-04-2024'}]), 'FASTag'); XLSX.writeFile(wb, 'fastag_mapping_template.xlsx'); };
  const pick = (o, res) => { const k = Object.keys(o).find(k => res.some(r => r.test(k))); return k ? o[k] : null; };
  $('faGo').onclick = e => act(e.target, async () => {
    const f = $('faF').files[0]; if(!f) throw new Error('Choose the FASTag Excel / CSV');
    const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true}); const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:null, raw:false});
    const rows = raw.map(r => { const o = {}; Object.entries(r).forEach(([k,v]) => o[String(k).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')] = v == null ? null : String(v).trim());
      return {registration_no:pick(o, [/^(vehicle|veh|registration|reg|vrn|truck)(_?no|_?number)?$/, /vehicle.*(no|num)/, /^vrn/]), tag_id:pick(o, [/^tag_?id$/, /fastag.*(id|no)/, /tag.*serial/, /^tid$/, /^tag_?(no|number)$/]),
        issuer:pick(o, [/issuer/, /^bank/]), customer_id:pick(o, [/customer/, /wallet/]), tag_status:pick(o, [/status/]), issued_on:isoD(pick(o, [/issu.*date/, /^issued_on$/, /activation/]))}; })
      .filter(r => r.registration_no || r.tag_id);
    if(!rows.length) throw new Error('No rows found: the sheet needs a vehicle number column and a tag ID column.');
    const res = await rpc('fl_fastag_map', {p_rows:rows});
    $('faOut').innerHTML = `<p><b>${res.mapped}</b> mapped · <b>${res.changed}</b> tag(s) replaced · <b>${res.unchanged}</b> already correct · of ${rows.length} row(s).</p>` + (res.errors.length ? `<div class="issues">${res.errors.length} row(s) not mapped</div>` + table([{h:'Row',k:'row'},{h:'Vehicle',k:'registration_no'},{h:'Tag',k:'tag_id'},{h:'Problem',k:'error'}], res.errors) : '');
    return res; }, r => `${r.mapped + r.changed} FASTag(s) mapped`);
};

async function upRun(d, file){
  modal(`<h2>Uploading ${esc(d.n)}</h2><div id="upP" class="muted">Reading file…</div><div id="upR"></div><div class="row" style="margin-top:12px"><button class="ghost" id="upClose" disabled>Close</button></div>`);
  const prog = t => $('upP').textContent = t;
  try{
    await loadMasters();
    const wb = XLSX.read(await file.arrayBuffer(), {cellDates:true}); const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:null, raw:true});
    const hmap = {}; d.cols.forEach(c => { hmap[UPN(c[0])] = c; hmap[UPN(c[1])] = c; });
    const res = {ok:0, skip:0, err:[], warn:[]}; const recs = [];
    raw.forEach((row, i) => {
      const rn = i + 2; const r = {}; let empty = true; const warns = [];
      try{
        const val = {}; Object.entries(row).forEach(([h, v]) => { const c = hmap[UPN(String(h).replace(/\*/g, ''))]; if(c && v != null && String(v).trim() !== '') { val[c[1]] = v; empty = false; } });
        if(empty) return;
        for(const c of d.cols){
          let v = val[c[1]]; const [, f, kind, req] = c;
          if(v == null){ if(req) throw new Error(`${c[0]} is missing`); continue; }
          if(kind === 'num'){ const x = +String(v).replace(/[₹,\s]/g, ''); if(isNaN(x)) throw new Error(`${c[0]} "${v}" is not a number`); r[f] = x; }
          else if(kind === 'date') r[f] = isoD(v);
          else if(kind === 'upper') r[f] = String(v).trim().toUpperCase();
          else if(kind.startsWith('sel:')){ const o = kind.slice(4).split('/').find(x => UPN(x) === UPN(v)); if(!o) throw new Error(`${c[0]} must be one of ${kind.slice(4).split('/').join(', ')}`); r[f] = o; }
          else if(kind.startsWith('ref:')){ const t = kind.slice(4); const hit = UP_REF[t](v, r);
            if(!hit){ if(req) throw new Error(`${UP_LBL[t]} "${v}" not found${t==='sardar' ? '' : ' — load it first'}`); warns.push(`${UP_LBL[t]} "${v}" not found, left blank`); continue; }
            r[f] = hit.id; }

        }

        recs.push({rn, rec, warns});
      }catch(e){ res.err.push({row:rn, problem:e.message}); }
    });
    if(d.rpcRows){
      for(let i = 0; i < recs.length; i += 200){
        prog(`Saving ${Math.min(i + 200, recs.length)} of ${recs.length}…`);
        const r = await rpc(d.rpcRows, {p_rows:recs.slice(i, i + 200).map(x => ({...x.rec, _row:x.rn}))});
        res.ok += (r.created || 0) + (r.updated || 0); res.skip += r.skipped || 0;
        (r.errors || []).forEach(e => /^driver saved/i.test(e.error) ? res.warn.push({row:e.row, problem:e.error}) : res.err.push({row:e.row, problem:e.error}));
        recs.slice(i, i + 200).forEach(x => x.warns.length && res.warn.push({row:x.rn, problem:x.warns.join('; ')}));
      }
      recs.length = 0;
    }
    // insert in batches; a failing batch is retried row by row so one bad row does not stop the rest
    const ins = async list => d.rpc === 'opening'
      ? (await Promise.all(list.map(x => sb.rpc('wh_opening_enter', {p_location:x.rec.location_id, p_material:x.rec.material_id, p_physical:x.rec.physical_mt, p_sap:x.rec.sap_mt, p_reason:x.rec.reason || null})))).find(x => x.error) || {}
      : await sb.from(d.t).insert(list.map(x => x.rec));
    for(let i = 0; i < recs.length; i += 200){
      prog(`Saving ${Math.min(i + 200, recs.length)} of ${recs.length}…`);
      const chunk = recs.slice(i, i + 200); const {error} = d.rpc ? {error:'row by row'} : await ins(chunk);
      if(!error){ res.ok += chunk.length; chunk.forEach(x => x.warns.length && res.warn.push({row:x.rn, problem:x.warns.join('; ')})); continue; }
      for(const x of chunk){ const {error:e} = await ins([x]);
        if(!e){ res.ok++; if(x.warns.length) res.warn.push({row:x.rn, problem:x.warns.join('; ')}); }
        else if(/duplicate key|already exists/i.test(e.message || e)) res.skip++;
        else res.err.push({row:x.rn, problem:niceErr(e.message || String(e))}); }
    }
    await loadMasters(); if(d.t === 'sys_plants'){ S.me = await rpc('wh_me'); S.locs = S.me.locations; }
    prog('');
    $('upR').innerHTML = `<p><b>${res.ok}</b> loaded · <b>${res.skip}</b> already in the system (skipped) · <b>${res.err.length}</b> not loaded${res.warn.length ? ` · <b>${res.warn.length}</b> loaded with a blank` : ''}</p>`
      + (res.err.length ? '<h2>Not loaded — fix and upload again</h2>' + table([{h:'Excel row',k:'row'},{h:'Problem',k:'problem'}], res.err.sort((a,b) => a.row - b.row)) : '')
      + (res.warn.length ? '<h2>Loaded, but something was left blank</h2>' + table([{h:'Excel row',k:'row'},{h:'Note',k:'problem'}], res.warn) : '')
      + (res.err.length + res.warn.length ? '<button class="ghost sm" id="upCsv">Download this list</button>' : '');
    if($('upCsv')) $('upCsv').onclick = () => csv([...res.err.map(x => ({...x, status:'not loaded'})), ...res.warn.map(x => ({...x, status:'loaded with blank'}))], 'upload-' + d.k + '-issues');
  }catch(e){ prog(''); $('upR').innerHTML = `<div class="issues">${esc(niceErr(e.message))}</div>`; }
  $('upClose').disabled = false; $('upClose').onclick = () => { closeModal(); go(); };
}

async function drFile(id){

    ${drLic(d)} ${d.joining_date ? `<span class="muted">Joined ${d8(d.joining_date)}</span>` : ''} ${d.address ? `<div class="muted">${esc(d.address)}</div>` : ''} ${d.emergency_name || d.emergency_mobile ? `<div class="muted">Emergency: ${esc([d.emergency_name, d.emergency_mobile].filter(Boolean).join(' · '))}</div>` : ''}

    ${d.licence_type ? '' : chip('licence type missing — fill it before assigning a truck','bad')}
    ${ed ? '<div class="row" style="margin:10px 0"><button class="ghost sm" id="dxEdit">Edit details</button></div>' : ''}
    <h2>Photos</h2><div class="grid">${DR_PHOTOS.map(([t, l]) => { const p = ev.find(x => x.entity_type === t);
      return `<div class="card" style="margin:0;padding:10px"><b>${l}</b> ${p ? chip('taken ' + d8(p.taken_at),'ok') : chip('missing','bad')}
        ${p && urls[p.id] ? `<a href="${urls[p.id]}" target="_blank"><img src="${urls[p.id]}" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:6px"></a>` : ''}

/* ---- monthly salary sheet ---- */
VIEWS.dr_salary = async m => {
  S.dsM = S.dsM || addMonths(localMonth(), -1);
  const [[mon], lines] = await Promise.all([q('dr_salary_months', b => b.eq('period', S.dsM)), qAll('dr_salary_sheet', b => b.eq('period', S.dsM).order('driver_name').order('seg_from'))]);
  const by = {}; lines.forEach(l => { const k = l.driver_id; by[k] = by[k] || {driver_name:l.driver_name, driver_code:l.driver_code, mobile:l.driver_mobile, days:0, amount:0, trucks:new Set(), missing:false};
    by[k].days += l.days; by[k].amount += +l.amount || 0; by[k].trucks.add(l.truck_no); if(l.monthly_rate == null) by[k].missing = true; });
  const tot = Object.values(by); const miss = lines.filter(l => l.monthly_rate == null).length; const ap = can('dr_salary_approve'); const locked = mon && mon.status === 'approved';
  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1>Driver salary · ${monthLbl(S.dsM)}</h1><div class="row"><select id="dsM" style="width:auto">${monthsBack(13).map(p => `<option value="${p}" ${p===S.dsM?'selected':''}>${monthLbl(p)}</option>`).join('')}</select>
    ${ap && !locked ? `<button class="ghost sm" id="dsRe">${mon ? 'Recalculate' : 'Calculate now'}</button>` : ''}${ap && mon && !locked ? '<button class="primary sm" id="dsAp">Approve & lock</button>' : ''}<button class="ghost sm" id="dsCsv">Download CSV</button></div></div>
  <p class="muted">${!mon ? 'Not calculated yet. It is calculated automatically on the 1st of the next month at 00:30.' : locked ? `Approved ${dt(mon.approved_at)} — locked.` : `Calculated ${dt(mon.calculated_at)}. Recalculate after correcting an assignment or a truck salary; approve to lock.`}
    Salary = truck salary per month × days on the truck ÷ days in the month; the changeover day goes to the incoming driver.</p>
  <div class="kpi"><div><span>Drivers</span><b>${tot.length}</b></div><div><span>Total salary</span><b>${inr(tot.reduce((s, x) => s + x.amount, 0))}</b></div>${miss ? `<div><span>Lines without truck salary</span><b style="color:var(--alert)">${miss}</b></div>` : ''}<div><span>Status</span><b style="font-size:16px">${mon ? (locked ? 'Approved' : 'Calculated') : '—'}</b></div></div>
  <div class="card"><h2>By driver</h2>${table([{h:'Driver',f:x=>esc(x.driver_name) + ` <span class="muted">${esc(x.driver_code)}</span>`},{h:'Mobile',k:'mobile'},{h:'Truck(s)',f:x=>esc([...x.trucks].join(', '))},{h:'Days',n:1,k:'days'},{h:'Salary',n:1,f:x=>'<b>' + inr(x.amount) + '</b>' + (x.missing ? ' ' + chip('truck salary missing','bad') : '')}], tot, mon ? 'No driver was on a truck this month.' : 'Not calculated yet.')}</div>
  <details class="card"><summary>Detail by truck and rate (${lines.length})</summary>${table([{h:'Driver',k:'driver_name'},{h:'Truck',k:'truck_no'},{h:'From',f:l=>d8(l.seg_from)},{h:'To',f:l=>d8(l.seg_to)},{h:'Days',n:1,f:l=>l.days + ' / ' + l.month_days},{h:'Salary / month',n:1,f:l=>l.monthly_rate == null ? chip('not set','bad') : inr(l.monthly_rate)},{h:'Amount',n:1,f:l=>inr(l.amount)}], lines)}</details>`;
  $('dsM').onchange = () => { S.dsM = $('dsM').value; go(); };
  if($('dsRe')) $('dsRe').onclick = e => act(e.target, () => rpc('dr_salary_recalc', {p_period:S.dsM}), n => `Calculated: ${n} line(s)`).then(() => go()).catch(() => {});
  if($('dsAp')) $('dsAp').onclick = e => { if(!confirm('Approve and lock the driver salary for ' + monthLbl(S.dsM) + '?')) return; act(e.target, () => rpc('dr_salary_approve', {p_period:S.dsM}), 'Approved and locked').then(() => go()).catch(() => {}); };
  $('dsCsv').onclick = () => csv(lines.map(l => ({month:S.dsM.slice(0, 7), driver_code:l.driver_code, driver:l.driver_name, mobile:l.driver_mobile, truck:l.truck_no, from:l.seg_from, to:l.seg_to, days:l.days, month_days:l.month_days, salary_per_month:l.monthly_rate, amount:l.amount})), 'driver-salary-' + S.dsM.slice(0, 7));
};

// vendor form in its own layer, so it can open on top of another form (e.g. "+ Add new vendor…" inside a truck slip)
function vnForm(v, preset, done){
  if(!can('vendor_admin')) return toast('Only HO / Admin can add or edit vendors', 'warn');
  const V = v || {kinds:[], ...(preset||{})}; S.qaN = (S.qaN||0) + 1; const P = 'vn' + S.qaN + '_';
  const ov = document.createElement('div'); ov.className = 'modal'; ov.style.zIndex = 70 + S.qaN;
  const f = (k, l, attrs='') => `<div class="field"><label>${l}</label><input id="${P}${k}" value="${esc(V[k]||'')}" ${attrs}></div>`;
  ov.innerHTML = `<div class="box"><h2>${v ? 'Edit ' + esc(v.vendor_name) + ` <span class="muted">${esc(v.vendor_code)}</span>` : 'New vendor'}</h2>
    <label>Vendor type (tick all that apply)</label>
    <div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px">${S.vtypes.filter(t => t.is_active || (V.kinds||[]).includes(t.code)).map(t => `<label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;margin:0"><input type="checkbox" data-k="${t.code}" ${(V.kinds||[]).includes(t.code)?'checked':''} style="width:18px;height:18px"> ${esc(t.name)}</label>`).join('')}</div>
    <div class="grid">
      ${f('vendor_name','Vendor name *')}${f('busy_name','Name in BUSY (blank = same)')}
      ${f('contact_person','Contact person')}${f('phone','Mobile *','inputmode="numeric" maxlength="14"')}${f('email','Email','type="email"')}
      ${f('pan','PAN *','maxlength="10" style="text-transform:uppercase"')}${f('gstin','GSTIN (if registered)','maxlength="15" style="text-transform:uppercase"')}
      <div class="field"><label>State</label><select id="${P}state_id">${opt(S.states,'id','name',V.state_id,'—')}</select></div>
      <div class="field" style="grid-column:1/-1"><label>Address</label><input id="${P}address" value="${esc(V.address||'')}"></div>
      ${f('bank_name','Bank name')}${f('bank_branch','Branch')}${f('bank_account','Bank account no.','inputmode="numeric"')}${f('bank_ifsc','IFSC','maxlength="11" style="text-transform:uppercase"')}${f('bank_holder','Account holder name')}
      <div class="field"><label>Cancelled cheque / passbook${v && v.cheque_docs ? ` (${v.cheque_docs} uploaded)` : ''}</label><input type="file" id="${P}chq" accept="image/*,application/pdf"></div>
      ${f('note','Note')}
      ${v ? `<div class="field"><label>Status</label><select id="${P}is_active"><option value="true">Active</option><option value="false" ${v.is_active ? '' : 'selected'}>Inactive (hidden from all dropdowns)</option></select></div>` : ''}
    </div><p class="muted">* required. One PAN = one vendor: if this vendor already exists for another type, edit it and tick the extra type. Bank details are needed before any bank payment.</p>
    <div class="row" style="margin-top:12px"><button class="primary" data-vs>Save vendor</button><button class="ghost" data-vc>Cancel</button></div></div>`;
  document.body.appendChild(ov);
  const g = k => ov.querySelector('#' + P + k);
  ov.querySelector('[data-vc]').onclick = () => ov.remove();
  ov.querySelector('[data-vs]').onclick = e => act(e.target, async () => {
    const r = {}; ['vendor_name','busy_name','contact_person','phone','email','pan','gstin','address','bank_name','bank_branch','bank_account','bank_ifsc','bank_holder','note'].forEach(k => r[k] = g(k).value.trim() || null);
    r.state_id = g('state_id').value || null; r.kinds = [...ov.querySelectorAll('[data-k]:checked')].map(i => i.dataset.k);
    if(v) r.is_active = g('is_active').value === 'true';
    ['pan','gstin','bank_ifsc'].forEach(k => r[k] = r[k] && r[k].toUpperCase().replace(/\s/g,''));
    if(!r.vendor_name) throw new Error('Enter the vendor name');
    if(!r.kinds.length) throw new Error('Tick at least one vendor type');
    let ph = (r.phone||'').replace(/[^0-9]/g, ''); if(/^0\d{10}$/.test(ph) || /^91\d{10}$/.test(ph)) ph = ph.slice(-10);
    if(!/^[6-9][0-9]{9}$/.test(ph)) throw new Error('Enter a valid 10-digit mobile number'); r.phone = ph;
    if(!r.pan || !PAN_RE.test(r.pan)) throw new Error('Enter a valid PAN (format ABCDE1234F)');
    if(r.gstin && !GST_RE.test(r.gstin)) throw new Error('GSTIN is not valid');
    if(r.gstin && r.gstin.slice(2,12) !== r.pan) throw new Error('GSTIN does not contain this PAN — check both');
    if(r.bank_ifsc && !IFSC_RE.test(r.bank_ifsc)) throw new Error('IFSC is not valid (format SBIN0001234)');
    if(!!r.bank_account !== !!r.bank_ifsc) throw new Error('Enter both the bank account number and the IFSC');
    if(!v){ const dup = S.vendors.find(x => x.pan === r.pan); if(dup) throw new Error(`PAN ${r.pan} already belongs to ${dup.vendor_name} (${dup.vendor_code}). Edit that vendor and tick the extra type.`); }
    const res = v ? await sb.from('sys_vendors').update(r).eq('id', v.id).select() : await sb.from('sys_vendors').insert(r).select();
    if(res.error) throw new Error(res.error.message);
    const row = (res.data||[])[0];
    if(!row) throw new Error('Not saved: only HO / Admin can add or edit vendors');
    const file = g('chq').files[0]; if(file) await uploadPhotoFile('vendor_cheque', row.id, file, 'Cheque · ' + row.vendor_name);
    await loadMasters(); ov.remove(); done && done(row); return row;
  }, row => `${row.vendor_name} saved (${row.vendor_code})`);
}

VIEWS.vn_import = async m => {
  m.innerHTML = `<h1>Import vendors from Excel</h1>
  <p class="muted">One row per vendor. Required: vendor_name and types. PAN, mobile and bank can be missing for now: such vendors load as "incomplete" (no payment until completed) and show in Data Upload › Data gaps. vendor_code: keep your existing code (e.g. VD0123); blank = next VD number. Types = names or codes from the Types sheet, separated by commas (e.g. "Body builder, RTO agent"). A PAN already in the system is not duplicated: its new types are added and blank details filled; nothing is overwritten. Rows with a problem are listed and skipped.</p>
  <div class="card"><div class="row"><button class="ghost sm" id="viT">Download template</button><input type="file" id="viF" accept=".xlsx,.xls,.csv" style="max-width:320px"><button class="primary sm" id="viGo">Import</button></div><div id="viOut"></div></div>`;
  $('viT').onclick = () => { const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{vendor_code:'', vendor_name:'MAA TARA TRANSPORT', busy_name:'Maa Tara Transport', bank_name:'STATE BANK OF INDIA', bank_branch:'HOWRAH', vendor_since:'', types:'Truck vendor (transporter)', contact_person:'Ramesh Das', phone:'9830012345', email:'', pan:'ABCDE1234F', gstin:'19ABCDE1234F1Z5', address:'Kolkata', state:'West Bengal', bank_account:'12345678901', bank_ifsc:'SBIN0001234', bank_holder:'MAA TARA TRANSPORT', note:''}], {header:VN_COLS}), 'Vendors');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.vtypes.filter(t => t.is_active).map(t => ({type_name:t.name, code:t.code, used_in:t.used_in||''}))), 'Types');
    XLSX.writeFile(wb, 'vendor_import_template.xlsx'); };
  $('viGo').onclick = e => act(e.target, async () => {
    const f = $('viF').files[0]; if(!f) throw new Error('Choose the filled Excel file');
    const wb = XLSX.read(await f.arrayBuffer()); const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:null, raw:false});
    const rows = raw.map(r => { const o = {}; Object.entries(r).forEach(([k,v]) => { const key = String(k).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); if(v!==null && String(v).trim()!=='') o[key] = String(v).trim(); }); return o; }).filter(o => o.vendor_name || o.pan);
    if(!rows.length) throw new Error('No vendor rows found. Use the template columns.');
    // large masters go in batches of 250 rows (keeps each call well inside the server time limit)
    const res = {created:0, updated:0, errors:[]};
    for(let i = 0; i < rows.length; i += 250){
      $('viOut').innerHTML = `<p class="muted">Importing ${Math.min(i + 250, rows.length)} of ${rows.length}…</p>`;
      const r = await rpc('vn_import', {p_rows:rows.slice(i, i + 250)});
      res.created += r.created; res.updated += r.updated; res.incomplete = (res.incomplete||0) + (r.incomplete||0); res.errors.push(...r.errors.map(e => ({...e, row:e.row + i})));
    }
    await loadMasters();
    $('viOut').innerHTML = `<p><b>${res.created}</b> created${res.incomplete ? ` (<b>${res.incomplete}</b> with PAN / mobile / bank missing — see Data gaps)` : ''} · <b>${res.updated}</b> existing vendor(s) updated · of ${rows.length} row(s).</p>` + (res.errors.length ? `<div class="issues">${res.errors.length} row(s) skipped</div>` + table([{h:'Row',k:'row'},{h:'Code',k:'vendor_code'},{h:'Vendor',k:'vendor_name'},{h:'Problem',k:'error'}], res.errors) : '');
    return res; }, r => `${r.created} vendor(s) created`);
};

async function dispatchDetail(m, id){
  const [d] = await q('wh_dispatches', b => b.eq('id', id));
  const slips = await q('wh_loading_slips', b => b.eq('dispatch_id', id).neq('status','cancelled').order('created_at'));
  let sources = [];
  {
    const bal = await q('wh_stock_view', b => b.eq('location_id', S.loc.id).eq('storage','fresh').order('material').order('batch'));
    bal.forEach(x => sources.push({key:`godown:${x.material_id}:${x.batch}`, label:`Godown · ${x.material} · batch ${x.batch} · ${n3(x.qty_mt)} MT in stock`}));
    const grns = await q('wh_grns', b => b.eq('location_id', S.loc.id).is('labor_bill_id', null).gte('created_at', new Date(Date.now()-3*86400000).toISOString()).order('created_at',{ascending:false}));
    grns.forEach(g => sources.push({key:'paltai:'+g.id, label:`Paltai from ${g.truck_no} (${g.grn_no}) · ${mat(g.material_id)} · ${g.batch} · ${n3(g.received_mt)} MT received`}));
  }
  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1>${esc(d.dispatch_no)} · <span class="plate">${esc(d.truck_no)}</span> ${chip(d.truck_kind)}</h1><button class="ghost sm" id="dBack">Back</button></div>
  <div class="card"><h2>Loading slips (one slip = one batch)</h2>${table([{h:'Slip',k:'slip_no'},{h:'Source',f:s=>chip(s.source.replace('_',' '))},{h:'Material',f:s=>esc(mat(s.material_id))},{h:'Batch',k:'batch'},{h:'Ship-To',k:'ship_to_code'},{h:'MT',n:1,f:s=>n3(s.qty_mt)},{h:'Status',f:s=>chip(s.status, s.status==='loaded'?'ok':'info')},
    {h:'',f:s=>s.status==='open'?`<button class="ghost sm" data-ps="${s.id}">Print</button> <button class="ghost sm" data-cx="${s.id}">Cancel</button>`:''}], slips, 'No slips yet.')}</div>
  ${d.status==='loading' ? `<div class="card"><h2>Add loading slip</h2><div class="grid">
    <div style="grid-column:1/-1"><label>Load from</label><select id="sSrc">${sources.length ? sources.map(s=>`<option value="${esc(s.key)}">${esc(s.label)}</option>`).join('') : '<option value="">No stock available</option>'}</select></div>

    <div class="row"><button class="lime" id="sGo">Add slip</button><button class="primary" id="dConf" ${slips.some(s=>s.status==='open')?'':'disabled'}>Truck loaded → generate challans</button></div>
    <p class="muted">If one batch is short, add a second slip from another batch. The in-charge is accountable if the batch loaded differs from the slip.</p></div>` : `<div class="okbox">Dispatched ${dt(d.dispatched_at)}</div>`}`;
  $('dBack').onclick = () => go();
  m.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => act(b, async () => { await rpc('wh_slip_cancel', {p_slip:b.dataset.cx}); dispatchDetail(m, id); }, 'Slip cancelled'));
  m.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => printSlip(slips.find(s=>s.id===b.dataset.ps), d));
  if(d.status!=='loading') return;
  $('sT').onchange = () => $('sSoL').innerHTML = soldToLine(d.client_id, $('sT').value);
  $('sT')._opts = () => destOpts(d.client_id, {exclude:S.loc.id}); $('sT')._preset = () => ({client_id:d.client_id}); wireAdd(m);
  $('sGo').onclick = e => act(e.target, async () => {
    const [kind, a, bch] = $('sSrc').value.split(':'); if(!kind) throw new Error('Nothing to load from');
    const p = {dispatch_id:id, source: kind==='lot'?'platform_lot':kind, qty_mt:+$('sQ').value, ship_to_code:$('sT').value, contractor_id:$('sL').value};
    if(kind==='wagon') p.wagon_id = a; if(kind==='lot') p.lot_id = a; if(kind==='paltai') p.source_grn_id = a; if(kind==='godown'){ p.material_id = a; p.batch = bch; }
    await rpc('wh_slip_create', {p}); dispatchDetail(m, id);
  }, 'Slip added');
  $('dConf').onclick = e => act(e.target, async () => { const n = await rpc('wh_dispatch_confirm', {p_dispatch:id}); const ch = await q('wh_challans', b => b.eq('dispatch_id', id)); printChallans(ch.map(c=>c.id)); dispatchDetail(m, id); return n; }, n => `${n} challan(s) generated`);
}

function printWin(html, w0){ const w = w0 || window.open('', '_blank'); w.document.write(`<html><head><title>Print</title><style>body{font-family:Segoe UI,Arial;padding:24px;color:#111}h2{margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #999;padding:6px;text-align:left}.n{text-align:right}.pg{page-break-after:always;margin-bottom:40px}</style></head><body>${html}<script>window.print()<\/script></body></html>`); w.document.close(); }
function printSlip(s, d){
  printWin(`<div class="pg"><h2>LOADING SLIP ${esc(s.slip_no)}</h2><div>${esc(S.loc.code)} · ${new Date().toLocaleString('en-IN')}</div>
  <table><tr><th>Truck</th><td>${esc(d.truck_no)}</td><th>Driver</th><td>${esc(d.driver_name||'')}</td></tr><tr><th>Material</th><td>${esc(mat(s.material_id))}</td><th>Batch</th><td><b>${esc(s.batch)}</b></td></tr>

  <p style="margin-top:40px">Labor signature ____________________ &nbsp;&nbsp; Staff signature ____________________</p></div>`);
}
async function printChallans(ids){
  const ch = await q('wh_challans', b => b.in('id', ids)); const lines = await q('wh_challan_lines', b => b.in('challan_id', ids));
  const disp = await q('wh_dispatches', b => b.in('id', [...new Set(ch.map(c=>c.dispatch_id))]));
  printWin(ch.map(c => { const d = disp.find(x=>x.id===c.dispatch_id)||{}; const w = S.plants.find(x=>x.id===c.to_location_id); const p = S.parties.find(x=>x.client_id===c.client_id && x.sap_code===c.ship_to_code) || (w ? {party_name:'SS Logistics · '+w.name, destination:w.code} : {});
    return `<div class="pg"><h2>${c.challan_no.startsWith('ADC')?'ADJUSTMENT CHALLAN (no physical movement)':c.is_damaged?'DELIVERY CHALLAN · DAMAGED BAGS':'DELIVERY CHALLAN'} ${esc(c.challan_no)}</h2><div>${esc(S.loc.code)} · ${new Date(c.created_at).toLocaleString('en-IN')}</div>
    <table><tr><th>Customer</th><td>${esc((S.clients.find(x=>x.id===c.client_id)||{}).name)}</td><th>Truck</th><td>${esc(d.truck_no||'—')}</td></tr>
    <tr><th>Sold-To</th><td>${esc(p.sold_to_name||'')} (${esc(c.sold_to_code||'')})</td><th>Contact</th><td>${esc(p.sold_to_phone||'')}</td></tr><tr><th>Ship-To</th><td>${esc(p.party_name||'')} (${esc(c.ship_to_code)})</td><th>Destination</th><td>${esc([p.destination,p.district,p.state].filter(Boolean).join(', '))}</td></tr><tr><th>Material</th><td colspan="3"><b>${esc(mat(c.material_id))}</b></td></tr></table>
    <table><tr><th>Batch</th><th class="n">MT</th><th class="n">Bags</th></tr>${lines.filter(l=>l.challan_id===c.id).map(l=>`<tr><td>${esc(l.batch)}</td><td class="n">${n3(l.qty_mt)}</td><td class="n">${l.bags??''}</td></tr>`).join('')}
    <tr><th>Total</th><th class="n">${n3(c.qty_mt)} MT</th><th class="n">${c.bags??''} Bags</th></tr></table><p style="margin-top:40px">Driver ____________________ &nbsp;&nbsp; For SS Logistics ____________________</p></div>`; }).join(''));
}

/* ============ MONTHLY STOCK COUNT ============ */
VIEWS.count = async m => {
  const counts = await q('wh_stock_counts', b => b.eq('location_id', S.loc.id).order('count_month', {ascending:false}).limit(12));
  const cur = counts.find(c => c.status!=='posted');
  let lines = cur ? await q('wh_count_lines', b => b.eq('count_id', cur.id).order('storage').order('batch')) : [];
  m.innerHTML = `<h1>Monthly stock count · ${esc(S.loc.code)}</h1>
  ${cur ? `<div class="card"><h2>${new Date(cur.count_month).toLocaleDateString('en-IN',{month:'long',year:'numeric'})} · ${chip(cur.status, cur.status==='submitted'?'warn':'info')}</h2>
    ${table([{h:'Location',f:l=>chip(l.storage, l.storage==='damaged'?'bad':'ok')},{h:'Material',f:l=>esc(mat(l.material_id))},{h:'Batch',k:'batch'},{h:'Book MT',n:1,f:l=>n3(l.book_mt)},
      {h:'Physical MT',f:l=>cur.status==='open'?`<input type="number" step="0.001" data-p="${l.id}" value="${l.physical_mt??''}" style="height:36px;width:110px">`:n3(l.physical_mt)},
      {h:'Difference',n:1,f:l=>l.diff_mt?`<b style="color:${l.diff_mt<0?'var(--alert)':'var(--ok)'}">${n3(l.diff_mt)}</b>`:''},
      {h:'Reason',f:l=>cur.status==='open'?`<select data-r="${l.id}" style="height:36px"><option value="">—</option><option value="damage" ${l.reason==='damage'?'selected':''}>Damage</option><option value="shortage" ${l.reason==='shortage'?'selected':''}>Shortage</option><option value="count_error" ${l.reason==='count_error'?'selected':''}>Count error (recount)</option></select>`:esc(l.reason||'')}], lines)}
    <div class="row" style="margin-top:10px">${cur.status==='open'?'<button class="ghost" id="cSave">Save counts</button><button class="primary" id="cSub">Submit</button>':''}${cur.status==='submitted'&&can('wh_variance_approve')?'<button class="primary" id="cPost">Approve & post adjustments</button>':''}</div></div>`
  : `<div class="card"><div class="grid"><div><label>Month</label><input type="month" id="cM" value="${today().slice(0,7)}"></div></div><button class="primary" id="cStart">Start count sheet</button></div>`}
  <div class="card"><h2>Past counts</h2>${table([{h:'Month',f:c=>new Date(c.count_month).toLocaleDateString('en-IN',{month:'short',year:'numeric'})},{h:'Status',f:c=>chip(c.status)},{h:'Posted',f:c=>dt(c.posted_at)}], counts.filter(c=>c.status==='posted'))}</div>`;
  if($('cStart')) $('cStart').onclick = e => act(e.target, async () => { await rpc('wh_count_start', {p_location:S.loc.id, p_month:$('cM').value+'-01'}); go(); }, 'Count sheet created from book stock');
  const save = async () => { for(const l of lines){ const p = document.querySelector(`[data-p="${l.id}"]`).value; const r = document.querySelector(`[data-r="${l.id}"]`).value; if(p==='' ) continue; if(+p!==+l.physical_mt || (r||null)!==(l.reason||null)) await rpc('wh_count_enter', {p_line:l.id, p_physical:+p, p_reason:r||null, p_note:null}); } };
  if($('cSave')) $('cSave').onclick = e => act(e.target, async () => { await save(); go(); }, 'Saved');
  if($('cSub')) $('cSub').onclick = e => act(e.target, async () => { await save(); await rpc('wh_count_submit', {p_count:cur.id}); go(); }, 'Submitted for approval');
  if($('cPost')) $('cPost').onclick = e => act(e.target, async () => { const n = await rpc('wh_count_post', {p_count:cur.id}); go(); return n; }, n => `${n} adjustment(s) posted`);
};

/* ============ SAP BILLING ============ */
function parseSapRows(rows){
  const hi = rows.findIndex(r => r.some(c => /^invoice no$/i.test(String(c||'').trim())));
  if(hi<0) throw new Error('Could not find the "INVOICE NO" column — is this the SAP billing export?');
  const H = rows[hi].map(c => String(c||'').trim().toUpperCase());
  const col = name => H.indexOf(name);
  const pick = (r, name) => { const i = col(name); return i<0 ? null : (r[i]==null ? null : String(r[i]).trim()); };
  const iso = v => { if(!v) return null; if(/^\d{2}-\d{2}-\d{4}$/.test(v)) return v.split('-').reverse().join('-'); if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); if(/^\d+(\.\d+)?$/.test(v)){ const d = XLSX.SSF.parse_date_code(+v); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; } return v; };
  return rows.slice(hi+1).filter(r => pick(r,'INVOICE NO')).map(r => ({
    invoice_no:pick(r,'INVOICE NO'), cancelled_invoice:pick(r,'CANCELLED INVOICE'), invoice_date:iso(pick(r,'INVOICE DATE')), gi_date:iso(pick(r,'ACTUAL GI DATE')),
    truck_no:pick(r,'TRUCK NO'), sold_to_code:pick(r,'SOLD TO PARTY'), ship_to_code:pick(r,'SHIP TO PARTY'), product_code:pick(r,'PRODUCT'), product_description:pick(r,'PRODUCT DESCRIPTION'),
    qty:+String(pick(r,'QTY')||'0').replace(/,/g,''), uom:pick(r,'UOM'), so_no:pick(r,'SO/PO NUMBER'), delivery_no:pick(r,'DELIVERY NO'), shipment_no:pick(r,'SHIPMENT NO'),
    batch_no:pick(r,'BATCH NO'), plant:pick(r,'PLANT'), transporter:pick(r,'TRANSPORTER NAME'), shipment_amount:pick(r,'SHIPMENT AMOUNT') }));
}

  $('bC').onchange = () => { S.billClient = $('bC').value; go(); };

  if($('bRel')) $('bRel').onclick = e => act(e.target, async () => { await rpc('wh_sap_release_holds', {p_client:cid}); go(); }, 'Holds re-checked');
  const tag = async s => { const [i,c,qv] = s.split('|'); await rpc('wh_tag', {p_invoice:i, p_challan:c, p_qty:+qv}); };
  m.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => act(b, async () => { await tag(b.dataset.tg); go(); }, 'Tagged'));

const rkIdx = st => RK_STEPS.findIndex(x => x[0]===st);
const rkChip = st => chip((RK_STEPS.find(x => x[0]===st)||[st,st])[1], st==='closed'?'ok':['arrived','unloading','unloaded'].includes(st)?'info':['released','cleared'].includes(st)?'warn':'');
const sardarName = id => { const x = S.sardars.find(y => y.id===id); return x ? ((S.vendors.find(v => v.id===x.vendor_id)||{}).vendor_name || 'Sardar') : '—'; };
const sardarOpts = sel => opt(S.sardars.filter(x => S.loc && x.siding_id===S.loc.id && x.is_active).map(x => ({id:x.id, n:sardarName(x.id)})), 'id', 'n', sel, 'Select Labour Sardar');
const plantCode = id => (S.plants.find(p => p.id===id)||{}).code || '';
const localDT = d => { const x = d ? new Date(d) : new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,16); };
const isoDT = v => v ? new Date(v).toISOString() : null;
const bearerTxt = b => b==='ssl' ? 'SSL bears DC/WC' : b==='customer' ? 'Customer bears DC/WC' : 'DC/WC bearer not set';
// terms in force on a date (effective-dated; latest effective_from on or before the date)
const rkBearer = (clientId, on) => { on = on || today(); return (S.terms.filter(x => x.siding_id===S.loc.id && x.client_id===clientId && x.effective_from <= on).sort((a,b) => b.effective_from.localeCompare(a.effective_from))[0] || {}).dcwc_bearer; };
function clockBar(pct, running, label){
  if(pct==null) return '';
  const c = pct>=90 ? 'var(--alert)' : pct>=75 ? '#D97F06' : pct>=50 ? '#B89400' : 'var(--moss)';
  return `<div class="clk"><div class="clkT"><span>${esc(label)}</span><b style="color:${c}">${pct}% ${running?'· running':''}</b></div><div class="clkB"><i style="width:${Math.min(100,pct)}%;background:${c}"></i></div></div>`;
}
function rakeCard(r){
  const c = r.calc || {};
  return `<button class="rkc" data-rk="${r.id}"><div class="row" style="justify-content:space-between"><b>${esc(r.rake_no)}</b>${rkChip(r.status)}</div>
    <div class="muted" style="margin-top:4px">${esc(r.client_code)} · ${esc(r.category)} · for ${esc(r.warehouse_code)} · from ${esc(r.source_siding)}</div>
    <div class="rkm"><span>Wagons <b>${r.wagons ? `${r.wagons_empty}/${r.wagons}` : r.planned_wagons}</b></span><span>MT <b>${n3(r.rr_mt || r.planned_mt)}</b></span><span>On platform <b>${n3(r.lot_mt)}</b></span></div>
    ${['planned','wagons_updated'].includes(r.status) ? `<div class="muted">Expected ${r.expected_arrival ? dt(r.expected_arrival) : '—'}</div>` : ''}
    ${clockBar(c.dc_used_pct, c.dc_running, 'Demurrage free time used')}${clockBar(c.wc_used_pct, c.wc_running, 'Wharfage free time used')}</button>`;
}

    <div class="card"><details><summary><b>Closed rakes (${closed.length})</b> <span class="muted">— open to see</span></summary>${table([{h:'Rake',f:r=>`<a href="#" data-rk="${r.id}"><b>${esc(r.rake_no)}</b></a>`},{h:'Customer',k:'client_code'},{h:'RR / FNR',f:r=>`${esc(r.rr_no||'')} / ${esc(r.fnr||'')}`},{h:'MT',n:1,f:r=>n3(r.rr_mt)},{h:'Placed',f:r=>dt(r.placed_at)},{h:'Closed',f:r=>dt(r.closed_at)}], closed.slice(0,40), 'No closed rakes yet.')}</details></div>`;

  };
  $('pC').onchange = () => { r.category_id = null; r.warehouse_id = null; upd(); }; upd();

  $('pCat')._opts = () => opt(S.cats.filter(c => c.client_id===$('pC').value && c.is_active), 'id', c => `${c.name} (${c.code})`, undefined, 'Select category');
  $('pCat')._preset = () => ({client_id:$('pC').value}); wireAdd($('modalBox'));
