/* ---------- corrections (permission rk_correct): reason, preview of what changes, then save ---------- */
function corrModal(title, body, kind, id, payload, after){
  modal(`<h2>Correct · ${esc(title)}</h2>${body}
    <div class="field" style="margin-top:10px"><label>Reason for the correction (kept in the rake history)</label><input id="crR"></div>
    <div id="crPrev"></div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="crPv">Preview changes</button><button class="primary" id="crGo">Save correction</button><button class="ghost" onclick="closeModal()">Cancel</button></div>`);
  const run = async preview => rpc('rk_correct', {p_kind:kind, p_id:id, p:payload(), p_reason:$('crR').value, p_preview:preview});
  const show = res => { const ch = res.changes || [];
    $('crPrev').innerHTML = `<div class="${ch.length ? 'warnbox' : 'okbox'}" style="margin-top:10px"><b>${ch.length ? (res.preview ? 'This will change:' : 'Changed:') : 'Nothing changes.'}</b>
      ${ch.length ? table([{h:'What',k:'item'},{h:'Before',f:x=>esc(x.before ?? '—')},{h:'After',f:x=>esc(x.after ?? '—')}], ch) : ''}</div>`; };
  $('crPv').onclick = e => act(e.target, async () => show(await run(true)));
  $('crGo').onclick = e => act(e.target, async () => { const res = await run(false); closeModal(); after && after(); return res; }, res => `Corrected · ${(res.changes||[]).length} item(s) updated`);
}
const corrList = ev => ev.event==='corrected' && ev.detail && ev.detail.changes ? `<details><summary>${(ev.detail.changes||[]).length} change(s)</summary>${(ev.detail.changes||[]).map(x => `<div class="muted">${esc(x.item)}: ${esc(x.before ?? '—')} → ${esc(x.after ?? '—')}</div>`).join('')}</details>` : '';
async function rkDetail(m, id, opts = {}){
  const [r] = await q('rk_rake_list', b => b.eq('id', id));
  if(!r){ m.innerHTML = '<div class="issues">Rake not found or not at your siding.</div>'; return; }
  const [wagons, uslips, lot, diffs, msgs, events, tlines] = await Promise.all([
    q('rk_wagons', b => b.eq('rake_id', id).order('sheet_sr')), q('rk_unload_slips', b => b.eq('rake_id', id).order('created_at')),
    q('rk_lot_balance', b => b.eq('rake_id', id)), q('rk_platform_diffs', b => b.eq('rake_id', id).order('created_at')),
    q('wh_messages', b => b.eq('rake_id', id).order('created_at')), q('rk_rake_events', b => b.eq('rake_id', id).order('at', {ascending:false})),
    q('rk_truck_lines', b => b.eq('rake_id', id))]);
  const wids = wagons.map(w => w.id);
  const [phB, phA, phD, phW] = await Promise.all([evidenceCount('rk_wagon_before', wids), evidenceCount('rk_wagon_after', wids), evidenceCount('rk_wagon_damage', wids), evidenceCount('rk_waiver', [id])]);
  const c = r.calc || {}; const si = rkIdx(r.status); const W = x => wagons.find(w => w.id===x);
  const openSlip = wid => uslips.find(u => u.wagon_id===wid && u.status==='open');
  const back = () => opts.only ? go() : rkDetail(m, id);
  const truckMt = wid => tlines.filter(l => l.wagon_id===wid && l.actual_mt!=null).reduce((a,l) => a + +l.actual_mt, 0);
  const unlMt = wid => uslips.filter(u => u.wagon_id===wid && u.status==='returned').reduce((a,u) => a + +u.good_mt + +u.damaged_mt, 0);
  const tsIds = [...new Set(tlines.map(l => l.truck_slip_id))];
  const allTrucks = tsIds.length ? await q('rk_truck_slips', b => b.in('id', tsIds)) : [];
  const openTrucks = allTrucks.filter(t => t.status==='open');
  const canCorr = can('rk_correct') && r.status!=='closed';
  const cMode = canCorr && S.corrMode === id;

  // ---- what to do next: one plain sentence per pending step, with the button that does it ----
  const nx = []; const lotLeft = lot.filter(x => Math.abs(+x.balance_mt) >= 0.0005).sort((a,b) => (a.sheet_sr||0)-(b.sheet_sr||0));
  const lotTxt = lotLeft.map(x => `Platform-Sr ${x.sheet_sr} (${+x.balance_mt > 0 ? n3(x.balance_mt) + ' MT left' : 'loaded ' + n3(-x.balance_mt) + ' MT more than unloaded'})`).join(', ');
  const go2 = (t, btn, lab) => nx.push(`<li>${t}${btn ? ` <button class="primary sm" data-nx="${btn}">${esc(lab)}</button>` : ''}</li>`);
  if(r.status==='planned') go2('Upload the RR PDF and the wagon sheet (Wagon sheet).');
  else if(r.status==='wagons_updated') go2('Mark the rake arrival and untick wagons that were not placed (Arrival).');
  else if(r.status!=='closed'){
    const notStarted = wagons.filter(w => w.status==='arrived'), inProg = wagons.filter(w => w.status==='unloading');
    if(notStarted.length) go2(`${notStarted.length} wagon(s) not started: take the before-photo and start unloading (Sr ${notStarted.map(w => w.sheet_sr).join(', ')}).`);
    if(inProg.length) go2(`${inProg.length} wagon(s) being unloaded: return the unloading slip, take the after-photo and mark empty (Sr ${inProg.map(w => w.sheet_sr).join(', ')}).`);
    if(openTrucks.length) go2(`${openTrucks.length} truck slip(s) waiting for the labour-confirmed quantity: ${openTrucks.map(t => esc(t.slip_no)).join(', ')} (Loading slips).`);
    if(['unloaded','released'].includes(r.status) && lotLeft.length) go2(`Platform not at zero: ${lotTxt}. Load it on a truck, or close the platform difference if it is a real shortage / excess.`, can('rk_platform_diff_close') ? 'rkDiff' : '', 'Close platform difference');
    else if(['arrived','unloading'].includes(r.status) && +r.lot_mt > 0 && can('rk_truck')) go2(`${n3(r.lot_mt)} MT on the platform waiting for trucks.`, 'rkTruck', '+ Load a truck');
    if(r.status==='unloaded') go2('All wagons empty. Record the rake release (railway and operational times).', can('rk_release_clear') ? 'rkRel' : '', 'Record release');
    if(r.status==='released' && !lotLeft.length) go2('Platform is at zero. Record platform clear.', can('rk_release_clear') ? 'rkClr' : '', 'Record platform clear');
    if(si >= rkIdx('unloaded') && !r.charges_at) go2('Enter the DC / WC assessed, waived and paid by the railway.', can('rk_charges') ? 'rkChg' : '', 'Enter DC/WC');
    if(diffs.some(d => d.status==='pending')) go2('Record the Sardar recovery for the platform shortage (Platform).');
    if(r.status==='cleared'){ if(!msgs.some(x => x.kind==='rake_closure')) go2('Draft the final shortage report for the customer.', can('rk_rake_close') ? 'rkRep' : '', 'Draft final report'); else go2('Everything done? Close the rake.', can('rk_rake_close') ? 'rkClose' : '', 'Close rake'); }
  }
  // figures that look like a wrong entry (more than 2 MT off the sheet)
  const odd = wagons.filter(w => w.status==='empty' && Math.abs(+w.diff_mt) > 2);
  const oddTxt = odd.map(w => `wagon Sr ${w.sheet_sr} (${+w.diff_mt < 0 ? 'excess ' + n3(-w.diff_mt) : 'short ' + n3(w.diff_mt)} MT)`).join(', ');

  let h = opts.only ? (canCorr ? `<div class="row" style="justify-content:flex-end;margin-top:-6px"><button class="${cMode ? 'danger' : 'ghost'} sm" id="rkCm">${cMode ? 'Exit correction mode' : '✎ Correct a mistake'}</button></div>` : '')
    : `<div class="row" style="justify-content:space-between"><h1>${esc(r.rake_no)} · ${esc(r.client_name)}</h1><div class="row">${canCorr ? `<button class="${cMode ? 'danger' : 'ghost'} sm" id="rkCm">${cMode ? 'Exit correction mode' : '✎ Correct a mistake'}</button>` : ''}<button class="ghost sm" id="rkBack">All rakes</button></div></div>`;
  h += `
  ${cMode ? `<div class="warnbox"><b>Correction mode.</b> A <b>Correct</b> button now shows on wagons, unloading slips and the arrival. Change the figure that was entered wrong (do not void and re-enter); press <b>Preview changes</b> to see everything it will update, give the reason, then save. Exit correction mode when done.</div>` : ''}
  ${nx.length || odd.length ? `<div class="card" style="border-left:4px solid var(--deep)">${opts.only ? `<details><summary><h2 style="display:inline">What to do next</h2> <span class="muted">· ${nx.length} step(s) pending on ${esc(r.rake_no)} — tap to see</span></summary>` : '<h2>What to do next</h2>'}<ol style="margin:6px 0 0 18px;padding:0;line-height:1.9">${nx.join('')}</ol>${opts.only ? '</details>' : ''}
    ${odd.length ? `<div class="warnbox" style="margin-top:8px">Check ${oddTxt}: far from the wagon sheet, possibly a wrong entry.${canCorr ? ' Use <b>✎ Correct a mistake</b> to fix it.' : ' Ask your supervisor to correct it.'}</div>` : ''}</div>` : ''}
  <div class="steps">${RK_STEPS.map(([k,l],i) => `<span class="${i<si?'done':i===si?'cur':''}">${i<si?'✓ ':''}${esc(l)}</span>`).join('')}</div>
  <div class="kpi ${opts.only ? 'hide' : ''}"><div><span>RR / FNR</span><b style="font-size:15px">${esc(r.rr_no||'—')} / ${esc(r.fnr||'—')}</b></div><div><span>Batch</span><b>${esc(r.batch||'—')}</b></div>
   <div><span>Wagons empty</span><b>${r.wagons ? `${r.wagons_empty}/${r.wagons}` : '—'}</b></div><div><span>Missing</span><b style="color:${r.wagons_missing?'var(--alert)':'inherit'}">${r.wagons_missing}</b></div>
   <div><span>On platform MT</span><b>${n3(r.lot_mt)}</b></div><div><span>DC + WC (system)</span><b>${inr((+c.dc_calc||0) + (+c.wc_calc||0))}</b></div></div>`;

  // intimation
  h += `<div class="card"><div class="row" style="justify-content:space-between"><h2>Intimation</h2><div class="row">
      ${['planned','wagons_updated'].includes(r.status) && can('rk_rake_edit') ? '<button class="ghost sm" id="rkEdit">Edit</button>' : ''}
      ${['planned','wagons_updated'].includes(r.status) && can('rk_rake_delete') ? '<button class="ghost sm" id="rkDel">Delete</button>' : ''}</div></div>
    <div class="grid"><div><label>From</label>${esc(r.source_siding)}</div><div><label>Placement siding</label>${esc(r.siding_code)}</div><div><label>For warehouse</label>${esc(r.warehouse_code)} · ${esc(r.warehouse_name)}</div>
     <div><label>Category</label>${esc(r.category)}</div><div><label>Planned</label>${r.planned_wagons} wagons · ${n3(r.planned_mt)} MT</div><div><label>Expected</label>${r.expected_arrival?dt(r.expected_arrival):'—'}</div>
     <div><label>DC / WC</label>${bearerTxt(r.dcwc_bearer)}</div>${r.note?`<div><label>Note</label>${esc(r.note)}</div>`:''}</div></div>`;

  // RR + wagon sheet
  if(['planned','wagons_updated'].includes(r.status) && can('rk_wagons_update')){
    h += `<div class="card"><h2>${r.status==='planned' ? 'Add RR and wagon sheet' : 'Replace RR / wagon sheet'}</h2><div class="grid">
      <div><label>RR PDF</label><input type="file" id="rkPdf" accept="application/pdf"></div>
      <div><label>Wagon sheet</label><input type="file" id="rkSheet" accept=".xlsx,.xls,.csv"></div>
      <div><label>Other destination's sheet (optional, duplicate check)</label><input type="file" id="rkSib" accept=".xlsx,.xls,.csv"></div></div>
      <div class="grid" id="rkHead" style="margin-top:10px">
      ${['rr_no:RR No','fnr:FNR','rr_date:RR date:date','railway_invoice_no:Railway invoice no','invoice_date:Invoice date:date','rr_wagon_count:Wagons (RR):number','rr_bags:Bags (RR):number','rr_mt:MT (RR):number'].map(x => { const [k,l,t] = x.split(':'); return `<div><label>${l}</label><input id="h_${k}" type="${t||'text'}" step="any" value="${esc(r[k]??'')}"></div>`; }).join('')}
      </div><p class="muted" id="rkBatch"></p><div id="rkWagonsNew"></div><div id="rkIssues"></div>
      <button class="primary" id="rkSaveW">Save wagons</button></div>`;
  }
  // arrival
  if(r.status==='wagons_updated' && can('rk_arrival')){
    h += `<div class="card"><h2>Mark arrival</h2><p class="muted">Untick wagons that were not placed. Free time and rates are what the railway gave for this rake.</p>
      <div class="grid"><div><label>Arrived at siding</label><input type="datetime-local" id="aA" value="${localDT()}"></div><div><label>Placed</label><input type="datetime-local" id="aP" value="${localDT()}"></div>
      <div><label>DC free time ends (date &amp; time)</label><input type="datetime-local" id="aDF"></div><div><label>WC free time ends (date &amp; time)</label><input type="datetime-local" id="aWF"></div>
      <div><label>Penal DC in force?</label><select id="aPen"><option value="">Choose…</option><option value="false">No</option><option value="true">Yes</option></select></div>
      <div><label>DC rate (₹ per wagon per hour)</label><input type="number" step="0.01" id="aDR"></div><div><label>WC rate (₹ per MT per hour)</label><input type="number" step="0.01" id="aWR"></div>
      <div><label>Rate note</label><input id="aRN" placeholder="e.g. penal DC notice no."></div></div>
      ${table([{h:'Placed',f:w=>`<input type="checkbox" data-pl="${w.id}" checked>`},{h:'Sr',k:'sheet_sr'},{h:'Wagon',k:'wagon_no'},{h:'Type',f:w=>esc(mat(w.material_id))},{h:'Position',f:w=>`<input type="number" data-pos="${w.id}" value="${w.sheet_sr}" style="width:90px;height:36px">`}], wagons)}
      <button class="primary" id="aGo" style="margin-top:10px">Mark arrival</button></div>`;
  }
  // wagons
  if(si >= rkIdx('arrived')){
    const canC = cMode;
    const placedN = wagons.filter(w => w.status!=='missing' && w.status!=='expected').length;
    h += `<div class="card"><div class="row" style="justify-content:space-between"><h2>Arrival</h2>${canC ? '<button class="ghost sm" id="rkCorrArr">Correct arrival (placed / positions)</button>' : ''}</div>
      <div class="grid"><div><label>RR / FNR</label>${esc(r.rr_no||'—')} / ${esc(r.fnr||'—')}</div><div><label>RR date</label>${r.rr_date ? d8(r.rr_date) : '—'}</div>

      : {v:'', dis:true, l:`Wagon Sr ${w.sheet_sr} · ${w.wagon_no} · start unloading first (before-photo) · ${rn(w.rake_id)}`});
    const lotOpts = lotRows.filter(x => x.kind===kind && +x.available_mt > 0).sort((a,b) => (a.sheet_sr||0) - (b.sheet_sr||0))
      .map(x => ({v:`p:${x.wagon_id}:${x.rake_id}`, l:`Platform-Sr ${x.sheet_sr} · ${x.wagon_no} · ${x.material} ${kind} · ${n3(x.available_mt)} MT free · ${rn(x.rake_id)}`}));
    const og = (lab, arr) => arr.length ? `<optgroup label="${esc(lab)}">${arr.map(x => `<option value="${esc(x.v)}" ${x.dis?'disabled':''}>${esc(x.l)}</option>`).join('')}</optgroup>` : '';
    // lines already added are taken out of the list until removed again
    fillSrc = () => { const used = new Set(L.map(x => x.key)); const w2 = wagOpts.filter(x => !used.has(x.v)), l2 = lotOpts.filter(x => !used.has(x.v));
      $('tSrc').innerHTML = (w2.some(x => !x.dis) || l2.length) ? og('Direct from wagon', w2) + og('From platform (lot of each wagon)', l2) : '<option value="">Nothing more to load</option>';

    L.push(k==='w' ? {key:v, label, source:'wagon', wagon_id:a} : {key:v, label, source:'platform', lot_wagon_id:a, rake_id:b2}); drawL(); fillSrc(); };
  await load();
  $('tGo').onclick = e => act(e.target, async () => {
    const own = $('tK').value==='own'; const tr = S.trucks.find(t => t.registration_no===$('tT').value.trim().toUpperCase());

      vendor_id:$('tK').value==='vendor'?$('tV').value||null:null, driver_name:$('tD').value, ship_to_code:$('tP').value, is_damaged:$('tDmg').checked,
      lines:L.map(x => ({source:x.source, wagon_id:x.wagon_id, lot_wagon_id:x.lot_wagon_id, planned_mt:x.planned_mt}))};
    const id = await rpc('rk_truck_create', {p}); closeModal();
    const [t] = await q('rk_truck_slips', b => b.eq('id', id)); const lines = await q('rk_truck_lines', b => b.eq('truck_slip_id', id));
    await printTruckSlip(t, lines, rakes); after && after(id);
  }, 'Truck slip created');
}


/* ---------- one page per stage: rake picker on top, that rake's data only ---------- */
async function rkStagePage(m, title, only, emptyMsg){
  if(!S.loc){ m.innerHTML = '<div class="empty">No siding assigned.</div>'; return; }
  const rakes = await q('rk_rake_list', b => b.eq('siding_id', S.loc.id).order('created_at', {ascending:false}));
  const running = rakes.filter(r => r.status !== 'closed'), closed = rakes.filter(r => r.status === 'closed');
  S.rkSel = S.rkSel || {};
  let sel = rakes.find(r => r.id === S.rkSel[S.loc.id]) || running[0] || null;
  const lab = r => `${r.rake_no} · ${r.client_code} · ${r.rr_no ? 'RR ' + r.rr_no : 'no RR yet'} · ${(RK_STEPS.find(x => x[0]===r.status)||[,r.status])[1]}`;
  m.innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:10px"><h1 style="margin:0">${esc(title)} · ${esc(S.loc.code)}</h1>
      <div style="flex:1 1 320px;max-width:560px"><label>Rake</label><select id="rkPick">${!sel && rakes.length ? '<option value="" selected>— Choose a rake —</option>' : ''}${rakes.length ? `
        ${running.length ? `<optgroup label="Running (${running.length})">${running.map(r => `<option value="${r.id}" ${sel && r.id===sel.id ? 'selected' : ''}>${esc(lab(r))}</option>`).join('')}</optgroup>` : ''}
        ${closed.length ? `<optgroup label="Closed (${closed.length})">${closed.map(r => `<option value="${r.id}" ${sel && r.id===sel.id ? 'selected' : ''}>${esc(lab(r))}</option>`).join('')}</optgroup>` : ''}` : '<option value="">No rake yet</option>'}</select></div></div>
    ${sel && sel.status==='closed' ? `<div class="warnbox" style="margin-bottom:8px">Closed rake ${esc(sel.rake_no)}: view only. To change anything, reopen it from Close &amp; history.</div>` : ''}
    <div id="rkStage"></div>`;
  if(!sel){ $('rkStage').innerHTML = `<div class="empty">No rake is running at ${esc(S.loc.code)}.${closed.length ? ` Pick a closed rake above to see its ${esc(title.toLowerCase())}.` : ''} New rakes are created in <a href="#rk/rk_board">Rake intimation</a>.</div>`; }
  else { S.rkSel[S.loc.id] = sel.id; await rkDetail($('rkStage'), sel.id, {only, empty:emptyMsg}); }
  $('rkPick').onchange = () => { if(!$('rkPick').value) return; S.rkSel[S.loc.id] = $('rkPick').value; go(); };
}

async function rkTruckDetail(m, id, backFn){
  const [t] = await q('rk_truck_slips', b => b.eq('id', id)); const lines = await q('rk_truck_lines', b => b.eq('truck_slip_id', id));

    const n = await rpc('rk_truck_confirm', {p_slip:id, p_lines:p}); const [t2] = await q('rk_truck_slips', b => b.eq('id', id));

  m.innerHTML = `<div class="row" style="justify-content:space-between"><h1>${grp==='lb' ? esc(LB_TITLE[S.mst] || S.mst) : grp==='ft' ? 'Truck models & financiers' : grp==='rk' ? 'Siding setup' : grp==='wh' ? 'Warehouse setup' : 'Master data'}</h1><select id="mS" style="width:auto;${grp==='lb' ? 'display:none' : ''}">${keys.map(k=>`<option ${k===S.mst?'selected':''}>${k}</option>`).join('')}</select></div>
  <div class="card"><h2>Add ${esc(S.mst)}</h2>${M.note?`<p class="muted">${esc(M.note)}</p>`:''}<div class="grid" id="mForm">${M.form.map(f => masterInput(f, 'f_')).join('')}</div><button class="primary" id="mAdd" style="margin-top:8px">Add</button></div>
  <div class="card">${table(M.cols.map(k => ({h:(M.labels||{})[k] || k.replace(/_id$/,'').replace(/_/g,' '), f:r => show(k, r[k])})).concat(EDIT_CFG[S.mst] && masterPerm(M) ? [{h:'', f:r => EDIT_CFG[S.mst].remove ? `<button class="ghost sm" data-rm="${rows.indexOf(r)}">Remove</button>` : `<button class="ghost sm" data-edit="${rows.indexOf(r)}">Edit</button>` + (S.me.admin && r.id ? ` <button class="danger sm" data-del="${rows.indexOf(r)}">Delete</button>` : '')}] : []), rows)}</div>
  ${!EDIT_CFG[S.mst] && /rate|conversion/i.test(S.mst) ? '<p class="muted">Rates are effective-dated: to change one, add a new row with a new effective date.</p>' : ''}`;
  m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editMaster(S.mst, rows[+b.dataset.edit], () => go()));
  m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const r = rows[+b.dataset.del]; const label = r.code || r.name || r.vendor_name || r.registration_no || r.sap_product_code || 'this record';
    if(!confirm(`Delete ${label} permanently? This cannot be undone. If it is used anywhere, set it Inactive instead.`)) return;
    act(b, async () => { const {data, error} = await sb.from(M.t).delete().eq('id', r.id).select();
      if(error) throw new Error(/foreign key/i.test(error.message) ? `${label} is used in other records and cannot be deleted. Edit it and set it Inactive instead.` : error.message);
      if(!data || !data.length) throw new Error('Only the Administrator can delete');
      await loadMasters(); if(M.t==='sys_plants'){ S.me = await rpc('wh_me'); S.locs = S.me.locations; } go(); }, 'Deleted');
  });
  m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if(!confirm('Remove this link?')) return; const r = rows[+b.dataset.rm]; act(b, async () => { let qb = sb.from(M.t).delete(); EDIT_CFG[S.mst].key.forEach(k => qb = qb.eq(k, r[k])); const {error} = await qb; if(error) throw new Error(error.message); await loadMasters(); go(); }, 'Removed'); });
  $('mS').onchange = () => { S.mst = $('mS').value; go(); };
  setupMasterForm(M, 'f_', $('mForm')); wireAdd($('mForm'));
  $('mAdd').onclick = e => act(e.target, async () => { await saveMaster(M, 'f_', $('mForm')); go(); }, 'Saved');
};
/* ============ MY PROFILE ============ */
VIEWS.profile = async m => {
  const me = await rpc('wh_me'); const p = me.profile || {};
  const perms = await q('sys_permissions', b => b.order('module').order('sort'));
  m.innerHTML = `<h1>My profile</h1>
  <div class="card"><div class="grid">
    <div><label>Email (login)</label><input value="${esc(p.email)}" disabled></div>
    <div><label>Full name</label><input id="pfN" value="${esc(p.full_name||'')}"></div>
    <div><label>Phone</label><input id="pfP" value="${esc(p.phone||'')}"></div>
    <div><label>Employee code</label><input value="${esc(p.employee_code||'')}" disabled></div>
    <div><label>Designation</label><input value="${esc(p.designation||'')}" disabled></div>
    <div><label>Department</label><input value="${esc(p.department||'')}" disabled></div></div>
    <button class="primary" id="pfSave">Save</button></div>
  <div class="card"><h2>Change password</h2><div class="grid"><div><label>New password</label><input id="pw1" type="password"></div><div><label>Repeat</label><input id="pw2" type="password"></div></div><button class="ghost" id="pwGo">Change password</button></div>
  <div class="card"><h2>My access</h2><p><b>Roles:</b> ${me.roles.map(r=>chip(r,'ok')).join(' ') || chip('No role','bad')}</p>
    <p><b>Locations:</b> ${me.office ? chip('All locations','info') : me.locations.map(l=>chip(l.code)).join(' ') || chip('None','bad')}</p>
    <p><b>I can:</b></p><ul>${perms.filter(x=>me.grants.includes(x.key)).map(x=>`<li>${esc(x.module)} · ${esc(x.description)}</li>`).join('') || '<li class="muted">Nothing yet — ask the administrator for a role.</li>'}</ul></div>`;
  $('pfSave').onclick = e => act(e.target, async () => { await rpc('sys_profile_update', {p_full_name:$('pfN').value, p_phone:$('pfP').value}); }, 'Profile saved');
  $('pwGo').onclick = e => act(e.target, async () => { if($('pw1').value.length<6) throw new Error('At least 6 characters'); if($('pw1').value!==$('pw2').value) throw new Error('The two passwords differ'); const {error} = await sb.auth.updateUser({password:$('pw1').value}); if(error) throw new Error(error.message); $('pw1').value=$('pw2').value=''; }, 'Password changed');
};

/* ============ USERS & ROLES (access administration) ============ */
VIEWS.access = async m => {
  S.acc = S.acc || (can('sys_user_admin') ? 'users' : 'roles');
  const [users, roles, perms, rp, ur, sc, locs] = await Promise.all([
    can('sys_user_admin') ? q('sys_users', b => b.order('email')) : [], q('sys_roles', b => b.order('name')), q('sys_permissions', b => b.order('module').order('sort')),
    q('sys_role_permissions'), can('sys_user_admin') ? q('sys_user_roles') : [], can('sys_user_admin') ? q('sys_user_scopes') : [], q('wh_locations', b => b.order('code'))]);
  const modules = [...new Set(perms.map(p => p.module))];
  const sub = [['users','Users'],['roles','Roles'],['perms','Permission catalogue']].filter(([k]) => k!=='users' || can('sys_user_admin'));
  m.innerHTML = `<h1>Users & roles</h1><div class="row" style="margin-bottom:12px">${sub.map(([k,l]) => `<button class="${S.acc===k?'primary':'ghost'} sm" data-sub="${k}">${l}</button>`).join('')}</div><div id="accBody"></div>`;
  m.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.acc = b.dataset.sub; go(); });
  const body = $('accBody');
  const roleNames = uid => ur.filter(x=>x.user_id===uid).map(x=>(roles.find(r=>r.id===x.role_id)||{}).name).filter(Boolean);
  const scopeTxt = uid => sc.some(x=>x.user_id===uid && x.scope_type==='all_locations') ? chip('All locations','info') : sc.filter(x=>x.user_id===uid && x.scope_type==='location').map(x=>chip((locs.find(l=>l.id===x.scope_id)||{}).code||'?')).join(' ') || chip('None','bad');
  const permGrid = (checked, disabled) => modules.map(md => `<div style="margin-bottom:10px"><div class="muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-bottom:4px">${esc(md)}</div>
     ${perms.filter(p=>p.module===md).map(p => `<label class="row" style="margin:0 0 4px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600"><input type="checkbox" data-perm="${p.key}" ${checked.includes(p.key)?'checked':''} ${disabled?'disabled':''}> ${esc(p.description)} <span class="muted">(${esc(p.action||'')})</span></label>`).join('')}</div>`).join('');

  const userForm = (u) => {
    const isNew = !u; u = u || {};
    const myRoles = ur.filter(x=>x.user_id===u.id).map(x=>x.role_id);
    const all = sc.some(x=>x.user_id===u.id && x.scope_type==='all_locations');
    const myLocs = sc.filter(x=>x.user_id===u.id && x.scope_type==='location').map(x=>x.scope_id);
    modal(`<h2>${isNew ? 'Add user' : esc(u.email)}</h2>
      <div class="grid">
        ${isNew ? `<div><label>Email (login)</label><input id="uE" type="email" placeholder="name@gmail.com"></div><div><label>Temporary password</label><input id="uP" value="${Math.random().toString(36).slice(2,8)}${Math.floor(Math.random()*90+10)}"></div>` : ''}
        <div><label>Full name</label><input id="uN" value="${esc(u.full_name||'')}"></div><div><label>Phone</label><input id="uPh" value="${esc(u.phone||'')}"></div>
        <div><label>Employee code</label><input id="uC" value="${esc(u.employee_code||'')}"></div><div><label>Designation</label><input id="uD" value="${esc(u.designation||'')}"></div>
        <div><label>Department</label><input id="uDp" value="${esc(u.department||'')}"></div>
        ${isNew ? '' : `<div><label>Status</label><select id="uA"><option value="true" ${u.is_active?'selected':''}>Active</option><option value="false" ${!u.is_active?'selected':''}>Inactive (no access)</option></select></div>`}
      </div>
      <h2 style="margin-top:10px">Roles</h2><div class="row">${roles.filter(r=>r.is_active).map(r => `<label class="row" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600" title="${esc(r.description||'')}"><input type="checkbox" data-role="${r.id}" ${myRoles.includes(r.id)?'checked':''}> ${esc(r.name)}</label>`).join('')}</div>
      <h2 style="margin-top:14px">Locations</h2><label class="row" style="margin:0 0 6px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:700"><input type="checkbox" id="uAll" ${all?'checked':''}> All locations (office / head office)</label>
      <div class="row" id="uLocs">${locs.map(l => `<label class="row" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" data-loc="${l.id}" ${myLocs.includes(l.id)?'checked':''}> ${esc(l.code)}</label>`).join('') || '<span class="muted">No locations yet — add them in Masters.</span>'}</div>
      <div class="row" style="margin-top:16px"><button class="primary" id="uGo">${isNew?'Add user':'Save'}</button>${isNew?'':'<button class="ghost" id="uPw">Set new password</button>'}<button class="ghost" onclick="closeModal()">Cancel</button></div>
      ${isNew?'<p class="muted">Share the email and temporary password with the user; they can change it in My profile. If they later sign in with Google using the same email, it opens this same account.</p>':''}`);
    const upd = () => $('uLocs').style.opacity = $('uAll').checked ? .4 : 1; $('uAll').onchange = upd; upd();
    $('uGo').onclick = e => act(e.target, async () => {
      const p = {full_name:$('uN').value, phone:$('uPh').value, employee_code:$('uC').value, designation:$('uD').value, department:$('uDp').value,
        role_ids:[...document.querySelectorAll('[data-role]:checked')].map(x=>x.dataset.role), all_locations:$('uAll').checked,
        location_ids:$('uAll').checked ? [] : [...document.querySelectorAll('[data-loc]:checked')].map(x=>x.dataset.loc)};
      if(isNew){ p.email = $('uE').value; p.password = $('uP').value; await rpc('sys_user_create', {p}); toast(`User added. Login: ${p.email} / ${p.password}`, 'ok', 12000); }
      else { p.id = u.id; p.is_active = $('uA').value==='true'; await rpc('sys_user_save', {p}); toast('Saved'); }
      closeModal(); if(p.id===S.me.user_id){ S.me = await rpc('wh_me'); } go();
    });
    if(!isNew) $('uPw').onclick = () => { const pw = prompt('New password for ' + u.email + ' (min 6 characters)'); if(pw) act(null, async () => { await rpc('sys_user_set_password', {p_user:u.id, p_password:pw}); }, 'Password set — share it with the user'); };
  };

  if(S.acc==='users'){
    body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="muted" style="margin:0">A login alone gives no access. Access = the user's roles, limited to their locations.</p><button class="primary" id="uNew">+ Add user</button></div>
    <div class="card">${table([{h:'User',f:u=>`<b>${esc(u.full_name||'')}</b><br><span class="muted">${esc(u.email)}</span>`},{h:'Phone',k:'phone'},{h:'Designation',f:u=>esc([u.designation,u.department].filter(Boolean).join(' · '))},
      {h:'Roles',f:u=>roleNames(u.id).map(n=>chip(n,'ok')).join(' ')||chip('No role','bad')},{h:'Locations',f:u=>scopeTxt(u.id)},{h:'Status',f:u=>u.is_active?chip('active','ok'):chip('inactive','bad')},{h:'',f:u=>`<button class="ghost sm" data-ed="${u.id}">Edit</button>`}], users)}</div>`;
    $('uNew').onclick = () => userForm(null);
    body.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => userForm(users.find(u=>u.id===b.dataset.ed)));
  }
  if(S.acc==='roles'){
    body.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="muted" style="margin:0">A role is a set of permissions. Give users roles; change a role once and every user holding it changes.</p>${can('sys_role_admin')?'<button class="primary" id="rNew">+ New role</button>':''}</div>
    <div class="card">${table([{h:'Role',f:r=>`<b>${esc(r.name)}</b><br><span class="muted">${esc(r.code)}</span>`},{h:'Description',k:'description'},{h:'Permissions',n:1,f:r=>r.code==='ADMIN'?'all':rp.filter(x=>x.role_id===r.id).length},
      {h:'Users',n:1,f:r=>can('sys_user_admin')?ur.filter(x=>x.role_id===r.id).length:''},{h:'Status',f:r=>r.is_active?chip('active','ok'):chip('inactive','bad')},{h:'',f:r=>`<button class="ghost sm" data-re="${r.id}">${can('sys_role_admin')&&!r.is_system?'Edit':'View'}</button>`}], roles)}</div>`;
    const roleForm = r => {
      const isNew = !r; r = r || {}; const ro = !can('sys_role_admin') || r.is_system;
      modal(`<h2>${isNew?'New role':esc(r.name)}</h2>${r.is_system?'<p class="muted">The Administrator role always holds every permission, including those added by future modules.</p>':''}
        <div class="grid">${isNew?'<div><label>Code</label><input id="rC" placeholder="e.g. PLANT_EXEC"></div>':''}<div><label>Name</label><input id="rN" value="${esc(r.name||'')}" ${ro?'disabled':''}></div>
        <div style="grid-column:span 2"><label>Description</label><input id="rD" value="${esc(r.description||'')}" ${ro?'disabled':''}></div>
        ${isNew||ro?'':`<div><label>Status</label><select id="rA"><option value="true" ${r.is_active?'selected':''}>Active</option><option value="false" ${!r.is_active?'selected':''}>Inactive</option></select></div>`}</div>
        <h2 style="margin-top:10px">Permissions</h2>${permGrid(r.is_system ? perms.map(p=>p.key) : rp.filter(x=>x.role_id===r.id).map(x=>x.permission_key), ro)}
        <div class="row" style="margin-top:14px">${ro?'':`<button class="primary" id="rGo">${isNew?'Create role':'Save'}</button>`}${!isNew&&!ro?'<button class="danger" id="rDel">Delete</button>':''}<button class="ghost" onclick="closeModal()">Close</button></div>`);
      if(ro) return;
      $('rGo').onclick = e => act(e.target, async () => {
        const p = {name:$('rN').value, description:$('rD').value, permissions:[...document.querySelectorAll('[data-perm]:checked')].map(x=>x.dataset.perm)};
        if(isNew){ p.code = $('rC').value; if(!p.code || !p.name) throw new Error('Code and name are required'); } else { p.id = r.id; p.is_active = $('rA').value==='true'; }
        await rpc('sys_role_save', {p}); closeModal(); S.me = await rpc('wh_me'); go();
      }, 'Role saved');
      if($('rDel')) $('rDel').onclick = e => { if(confirm('Delete role ' + r.name + '?')) act(e.target, async () => { await rpc('sys_role_delete', {p_role:r.id}); closeModal(); go(); }, 'Role deleted'); };
    };
    if($('rNew')) $('rNew').onclick = () => roleForm(null);
    body.querySelectorAll('[data-re]').forEach(b => b.onclick = () => roleForm(roles.find(r=>r.id===b.dataset.re)));
  }
  if(S.acc==='perms'){
    body.innerHTML = `<p class="muted">Every module adds its permissions here as it is built. Roles pick them up in the Roles tab; the Administrator role gets them automatically.</p>
    <div class="card">${table([{h:'Module',k:'module'},{h:'Permission',k:'description'},{h:'Action',k:'action'},{h:'Code',f:p=>`<span class="muted">${esc(p.key)}</span>`},{h:'In roles',f:p=>roles.filter(r=>r.code==='ADMIN'||rp.some(x=>x.role_id===r.id&&x.permission_key===p.key)).map(r=>chip(r.name)).join(' ')}], perms)}</div>`;
  }
};
</script>
</body>
